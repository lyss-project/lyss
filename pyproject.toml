[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lyss"
version = "0.16.1"
description = "LYSS (Lyaazale Switch Security): open, vendor-neutral security standard and read-only audit tool for network switches"
# README with absolute links for PyPI: generated by setup.py
dynamic = ["readme"]
license = "AGPL-3.0-only AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-SPEC", "NOTICE", "TRADEMARKS.md"]
authors = [{name = "Mouad Lyaazale", email = "lyaazale@lyss.dev"}]
keywords = ["network", "switch", "security", "audit", "compliance", "cisco", "mikrotik", "routeros",
            "sonic", "aruba", "hardening", "baseline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "netmiko>=4.8",
    # paramiko 5 dropped the SHA-1 algorithms that legacy switches still require: lyss.legacy_ssh
    # adds them back, opt-in per connection; it relies on paramiko internals, so one major version
    "paramiko>=5.1,<6",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://lyss.dev"
Source = "https://github.com/lyss-project/lyss"
Issues = "https://github.com/lyss-project/lyss/issues"
Changelog = "https://github.com/lyss-project/lyss/blob/main/CHANGELOG.md"
Specification = "https://github.com/lyss-project/lyss/blob/main/docs/LYSS-Specification.md"
Funding = "https://ko-fi.com/lyaazale"

[project.optional-dependencies]
dev = ["pytest>=8", "aiosmtpd>=1.4", "openpyxl>=3.1"]

[project.scripts]
lyss = "lyss.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lyss.web" = ["templates/*.html", "static/*"]
"lyss.sim" = ["labs/*/*.yaml", "labs/*/*.cfg", "labs/*/*.state"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
