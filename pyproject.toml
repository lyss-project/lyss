[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyss"
version = "0.7.0"
description = "LYSS (Lyaazale Switch Security): open, vendor-neutral security standard and assessment tool for network switches"
readme = "README.md"
license = {text = "AGPL-3.0-only with additional terms, see NOTICE (code); CC-BY-4.0 (specification)"}
authors = [{name = "Mouad Lyaazale"}]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "netmiko>=4.8",
    # paramiko 4+ dropped the SHA-1 key exchanges that legacy switches still require
    "paramiko>=3.5,<4",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "aiosmtpd>=1.4", "openpyxl>=3.1"]

[project.scripts]
lyss = "lyss.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lyss.web" = ["templates/*.html", "static/*"]
"lyss.sim" = ["labs/*/*.yaml", "labs/*/*.cfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
