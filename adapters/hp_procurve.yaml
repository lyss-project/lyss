# LYSS adapter: HP ProCurve / HPE Aruba AOS-S (ArubaOS-Switch: 2530, 2540, 2920, 2930F/M, 3810, 5400R...).
# Rule forms: see adapters/cisco_ios.yaml.
# AOS-S lists ports as ranges on global lines ("untagged 1-24", "trunk 25-26 trk1 lacp",
# "spanning-tree 1-24 bpdu-protection"): edge-port rules use uplink_lists / require_lists.
# Credentials only appear in the config when "include-credentials" is enabled.
adapter: hp_procurve
spec_version: "1.0.0-rc.1"
platform: HP ProCurve / HPE Aruba AOS-S
status: preview, validated on the LYSS simulator and synthetic AOS-S 16.10 / 16.11 outputs (no real device yet)
support: preview          # stable: Level 1-2 verified on the vendor's own software; preview: not yet
tested_on: synthetic

facts:
  model:
    - {section: show modules, line: 'Chassis:\s+(.+?)\s{2,}'}
    # configuration header: "; JL253A Configuration Editor; Created on release #WC.16.11.0032"
    - {section: config comments, line: '^;\s*(J[A-Z]?\d{3,4}[A-Z])\s+Configuration Editor'}
    # stacked / VSF switches ("; hpStack_KB Configuration Editor"): the first member's model, from
    # "stacking / member 1 type \"JL075A\" ..." or "vsf / member 1 / type \"JL256A\" ..."
    - {section: config, line: '^member \d+ type "(J[A-Z]?\d{3,4}[A-Z])"'}
    - {section: config, line: '^type "(J[A-Z]?\d{3,4}[A-Z])"'}
  version:
    - {section: show version, line: '^\s*([A-Z]{1,2}\.\d{2}\.\d{2}\.\d{4})\s*$'}
    - {section: show system, line: 'Software revision\s*:\s*([A-Z]{1,2}\.[\d.]+)'}
    - {section: config comments, line: 'Created on release #([A-Z]{1,2}\.[\d.]+)'}

checks:

  # ---------------- Level 1 ----------------

  LYSS-MGMT-001:
    fail_if_any:
      - {line: '^telnet-server\s*$'}
    pass_if_any:
      - {line: '^no telnet-server\s*$'}
    otherwise: fail
    note: The Telnet server is enabled by default; only "no telnet-server" appears in the configuration.
    remediation: |
      no telnet-server

  LYSS-MGMT-002:
    fail_if_any:
      - {state: '^SSH-1\.', section: ssh banner}
    pass_if_any:
      - {state: '^SSH-2\.0-', section: ssh banner}
      - {line: '^ip ssh version 2\s*$'}
    otherwise: unknown
    note: Older firmware defaults to "1-or-2"; recent firmware is SSHv2 only. Collect the SSH banner.
    remediation: |
      ip ssh version 2

  LYSS-MGMT-003:
    fail_if_any:
      - {line: '^web-management plaintext\b'}
    pass_if_any:
      - {line: '^no web-management( plaintext)?\s*$'}
    otherwise: fail
    note: Plaintext web management (HTTP) is enabled by default.
    remediation: |
      web-management ssl            ! only if the web interface is really needed (needs a certificate)
      no web-management plaintext

  LYSS-MGMT-004:
    fail_if_any:
      - {line: '^console idle-timeout 0\s*$'}
      - {line: '^console idle-timeout (\d+)\s*$', gt: 600}
      # the serial / USB console has its own value: 0 (never) or too long fails too
      - {line: '^console idle-timeout serial-usb 0\s*$'}
      - {line: '^console idle-timeout serial-usb (\d+)\s*$', gt: 600}
    pass_if_all:
      - {line: '^console idle-timeout \d+\s*$'}
    otherwise: fail
    note: The default idle timeout is 0 (never). The value is in seconds and covers console, Telnet and SSH sessions.
    remediation: |
      console idle-timeout 600
      console idle-timeout serial-usb 600

  LYSS-AUTH-001:
    fail_if_any:
      - {line: '(?i)^snmp-server community "?(public|private)"?'}
    otherwise: pass
    note: The factory configuration ships with community "public".
    remediation: |
      no snmp-server community "public"

  LYSS-AUTH-002:
    fail_if_any:
      - {line: '^password manager .*\bplaintext\b'}
      - {line: '^password manager .*\bsha1\b', say: 'manager password stored as SHA-1: not accepted (use a firmware storing it as sha256)'}
    pass_if_all:
      - {line: '^password manager .*\bsha256\b'}
    otherwise: unknown
    note: Manager password not visible (include-credentials off) or not set; confirm on the device. SHA-1 is not accepted.
    remediation: |
      password manager user-name <name> plaintext <new-secret>   ! stored as a hash by the switch
      encrypt-credentials

  LYSS-AUTH-003:
    fail_if_any:
      - {line: '^password (manager|operator) .*\bplaintext\b'}
    pass_if_all:
      - {line: '^include-credentials\b'}
    otherwise: unknown
    note: Local credentials are only visible with include-credentials.
    remediation: |
      encrypt-credentials

  LYSS-AUTH-004:
    fail_if_any:
      - {line: '^(radius|tacacs)-server .*(?<!encrypted-)\bkey\s'}
    otherwise: pass
    note: Keys appear only with include-credentials; "encrypt-credentials" stores them as encrypted-key.
    remediation: |
      encrypt-credentials
      ! then rotate the shared key on the switch AND on the RADIUS/TACACS+ server

  LYSS-VULN-001:
    firmware: true
    otherwise: unknown
    note: Model/firmware not collected and not in the configuration header, or platform not yet in data/firmware.yaml.
    remediation: |
      ! upgrade to the latest AOS-S 16.11 release (>= 16.11.0032 fixes HPESBNW05156)
      ! older branches (15.x, 16.10 and before) are not fixed: upgrade the branch or replace the switch
      ! until then, restrict management access to the admin network (LYSS-MGMT-010)

  LYSS-BKP-001:
    backup: true   # vendor-neutral: evaluated from the LYSS configuration archive / attestation
    otherwise: unknown
    note: No backup evidence yet. Enable scheduled scans, or attest the external backup system on the switch page.
    remediation: |
      ! Settings > Scheduled scans (LYSS keeps every configuration version), or
      ! attest the external backup (Oxidized, RANCID...) on the switch page.

  # ---------------- Level 2 ----------------

  LYSS-AUTH-010:
    fail_if_any:
      # the secondary method must be "local": "none" or "authorized" let anyone in when the server does not answer
      - {line: '^aaa authentication ssh login (radius|tacacs)\b.*\b(none|authorized)\b'}
    pass_if_all:
      - {line: '^aaa authentication ssh login (radius|tacacs)\b'}
      - {line: '^(radius|tacacs)-server host '}
    otherwise: fail
    note: SSH logins must try RADIUS/TACACS+ first, with the local account as the only fallback. Console logins are not assessed.
    remediation: |
      radius-server host <nps-ip> key <key>
      aaa authentication ssh login radius local
      aaa authentication ssh enable radius local

  LYSS-AUTH-011:
    fail_if_any:
      - {line: '^snmp-server community '}
      # SNMPv3 below authPriv: users without "priv", groups of the auth / noauth security levels
      - {line: '^snmpv3 user (?!.*\bpriv\b)'}
      - {line: '^snmpv3 group (manager|operator)(auth|noauth)\b'}
    otherwise: pass
    remediation: |
      no snmp-server community <name>
      snmpv3 enable
      snmpv3 only
      snmpv3 user <user> auth sha <pw> priv aes <pw>

  LYSS-MGMT-010:
    pass_if_all:
      - {line: '^ip authorized-managers \S+'}
    otherwise: fail
    remediation: |
      ip authorized-managers <admin-subnet> <mask> access manager

  LYSS-MGMT-011:
    fail_if_any:
      - {block: '^vlan 1$', line: '^ip address (\d|dhcp)'}
      # access ports (untagged, not tagged in any VLAN, not trunk groups) in the management VLAN
      - captures_in_both:
          - [{line: '^management-vlan (\d+)'}, {block: '^vlan (\d+)$', where: '^ip address \d'}]
          - {untagged_access_vlans: true}
    pass_if_any:
      - {line: '^management-vlan \d+'}
      - {block: '^vlan (?!1$)\d+$', line: '^ip address \d'}
    otherwise: unknown
    remediation: |
      vlan <mgmt-vlan>
       ip address <ip> <mask>
      exit
      management-vlan <mgmt-vlan>
      ! then remove the VLAN 1 address once the new one is reachable

  LYSS-MGMT-012:
    pass_if_all:
      - {line: '^banner motd\b'}
      # the word inside the MOTD banner itself ("ip authorized-managers" must not count)
      - {line: '(?i)^(banner motd\b|banner-text motd ).*authori[sz]ed'}
    otherwise: fail
    note: Only the MOTD banner is shown before authentication ("banner exec" comes after login).
    remediation: |
      banner motd "Authorized access only. Activity is logged."

  LYSS-MGMT-013:
    fail_if_any:
      - {state: '^kex: .*(sha1|group1\b)', section: ssh negotiated}
      - {state: '^cipher: .*(cbc|3des|arcfour|blowfish)', section: ssh negotiated}
      - {state: '^hostkey: (ssh-rsa|ssh-dss)\s*$', section: ssh negotiated}
    pass_if_any:
      - {state: '^kex: ', section: ssh negotiated}
    otherwise: unknown
    note: Needs the negotiated SSH algorithms (collector).
    remediation: |
      ip ssh cipher aes256-ctr aes192-ctr aes128-ctr
      ip ssh mac hmac-sha2-256 hmac-sha2-512
      ip ssh kex ecdh-sha2-nistp256 ecdh-sha2-nistp384
      crypto key generate ssh rsa bits 2048   ! older firmware may lack these options: upgrade AOS-S

  LYSS-LOG-010:
    pass_if_any:
      - {line: '^logging \d+\.\d+\.\d+\.\d+'}
    otherwise: fail
    remediation: |
      logging <siem-ip>
      logging severity info

  LYSS-LOG-011:
    fail_if_any:
      - {line: '^(sntp server (priority \d+ )?\S+|ntp server \S+)', absent: true, say: 'no SNTP/NTP server configured'}
      # only in NTP mode: with "timesync sntp" the NTP status says nothing about the SNTP clock
      - all:
          - {line: '^ntp server \S+'}
          - {line: '^timesync sntp\b', absent: true}
          - {state: '(?i)Synchronization Status\s*:\s*(Not|Un)', section: show ntp status}
    pass_if_all:
      - {line: '^ntp server \S+'}
      - {line: '^timesync sntp\b', absent: true}
      - {state: '(?i)Synchronization Status\s*:\s*Synchroni[sz]ed\b', section: show ntp status}
    otherwise: unknown
    note: >-
      Synchronization is read from "show ntp status" (NTP mode). In SNTP mode AOS-S reports no
      synchronization status, so the verdict stays unknown: prefer "timesync ntp".
    remediation: |
      timesync ntp
      ntp unicast
      ntp server <ntp-ip> iburst
      ntp enable

  LYSS-ACC-010:
    fail_if_any:
      # "show interfaces brief": Enabled = Yes and Status = Down (enabled but nothing connected)
      - {state: '^\s*[A-Z]?\d+(-Trk\d+)?\s.*\|\s+\S+\s+Yes\s+Down\b', section: show interfaces brief}
    pass_if_any:
      - {state: '^\s*[A-Z]?\d+(-Trk\d+)?\s.*\|', section: show interfaces brief, say: 'show interfaces brief: no port is enabled without a link'}
    otherwise: unknown
    note: Needs "show interfaces brief".
    remediation: |
      interface <unused-ports>
       disable
      exit

  LYSS-ACC-011:
    # edge ports = every port, minus trunk members and ports tagged in a VLAN (uplinks, APs with
    # several VLANs); "spanning-tree <ports> bpdu-protection" must cover the rest
    fail_if_any:
      - edge_ports_missing: &edge
          ports: {section: show interfaces brief, line: '^\s*([A-Z]?\d+)(?:-Trk\d+)?\s.*\|'}
          uplink_lists: ['^trunk (\S+) ', '^tagged (\S+)']
          disabled_config: '^disable\s*$'
          require_lists: '^spanning-tree (\S+) bpdu-protection'
    unknown_if_any:
      # a trunk group (link aggregation) tagged in no VLAN may go to a server (an edge port that needs
      # "spanning-tree TrkN bpdu-protection") or to another switch carrying only untagged VLAN 1,
      # where BPDU protection would cut the link: the configuration cannot tell them apart
      - uncovered:
          what: trunk groups tagged in no VLAN, without BPDU protection (to a server or to another switch?)
          used: {line: '(?i)^trunk \S+ (trk\d+)\b'}
          covered: [{block: '^vlan \d+$', line: '^tagged (\S+)'}, {line: '^spanning-tree (\S+) bpdu-protection'}]
          lists: ports
    pass_if_any:
      - {edge_ports_missing: *edge, absent: true}
    otherwise: unknown
    note: >-
      Needs "show interfaces brief" to know the ports; trunk and tagged ports count as uplinks. A trunk
      group tagged in no VLAN is unknown: protect it with "spanning-tree TrkN bpdu-protection" only if
      it goes to an end device such as a server, never if it links two switches (it would cut the link).
    remediation: |
      ! only on edge ports (users, printers, APs, servers) - never on links to other switches
      spanning-tree <edge-ports> bpdu-protection

  # ---------------- Level 3 ----------------
  # Syntax from the AOS-S 16.x guides; simulator and synthetic outputs only so far. User VLANs =
  # VLANs with untagged access ports (as for LYSS-MGMT-011); edge ports as for LYSS-ACC-011.
  # Uplinks for the trust checks = trunk members, trunk groups and ports tagged in a VLAN.

  LYSS-ACC-020:
    not_applicable_if_any: &hp_no_access
      - {not: {captured: {untagged_access_vlans: true}}, say: 'no VLAN with untagged access ports'}
    fail_if_any:
      - {not: {line: '^dhcp-snooping\s*$'}, say: 'DHCP snooping is not enabled globally ("dhcp-snooping")'}
      # a trusted port that is not an uplink accepts DHCP server messages from an end device
      - uncovered:
          what: non-uplink ports trusted for DHCP snooping
          used: {line: '^dhcp-snooping trust (\S+)'}
          covered: &hp_uplinks [{line: '^trunk (\S+) '}, {line: '(?i)^trunk \S+ (trk\d+)\b'}, {block: '^vlan \d+$', line: '^tagged (\S+)'}]
          lists: ports
      - uncovered: &hp_snooping
          what: access VLANs without DHCP snooping
          used: {untagged_access_vlans: true}
          covered: {line: '^dhcp-snooping vlan (.+)$'}
          lists: true
    pass_if_any:
      - {uncovered: *hp_snooping, absent: true}
    otherwise: fail
    remediation: |
      dhcp-snooping
      dhcp-snooping vlan <access-vlans>
      dhcp-snooping trust <uplink-ports>

  LYSS-ACC-021:
    not_applicable_if_any: *hp_no_access
    fail_if_any:
      - {not: {line: '^arp-protect\s*$'}, say: 'ARP protection is not enabled globally ("arp-protect")'}
      # a trusted port that is not an uplink skips ARP protection
      - uncovered:
          what: non-uplink ports trusted for ARP protection
          used: {line: '^arp-protect trust (\S+)'}
          covered: *hp_uplinks
          lists: ports
      - uncovered: &hp_dai
          what: access VLANs without ARP protection
          used: {untagged_access_vlans: true}
          covered: {line: '^arp-protect vlan (.+)$'}
          lists: true
    pass_if_any:
      - {uncovered: *hp_dai, absent: true}
    otherwise: fail
    remediation: |
      arp-protect
      arp-protect vlan <access-vlans>
      arp-protect trust <uplink-ports>

  LYSS-ACC-022:
    not_applicable_if_any: *hp_no_access
    fail_if_any:
      - edge_ports_missing: &hp_nac
          ports: {section: show interfaces brief, line: '^\s*([A-Z]?\d+)(?:-Trk\d+)?\s.*\|'}
          uplink_lists: ['^trunk (\S+) ', '^tagged (\S+)']
          require_lists: '^aaa port-access (?:authenticator|mac-based) ([A-Z]?\d[\w,-]*)'
    pass_if_any:
      - {edge_ports_missing: *hp_nac, absent: true}
    otherwise: unknown
    note: Needs "show interfaces brief" to know the ports; "aaa port-access authenticator active" must also be set.
    remediation: |
      aaa port-access authenticator <edge-ports>
      aaa port-access authenticator active
      aaa port-access mac-based <ports-without-supplicant>

  LYSS-ACC-023:
    not_applicable_if_any: *hp_no_access
    fail_if_any:
      # a 100 % limit on a port that is not an uplink limits nothing
      - uncovered:
          what: edge ports with a 100 % broadcast limit (no limit)
          used: {block: '^interface (\S+)$', where: '^(broadcast-limit|rate-limit bcast in percent) 100\b'}
          covered: *hp_uplinks
          lists: ports
      - edge_ports_missing: &hp_storm
          ports: {section: show interfaces brief, line: '^\s*([A-Z]?\d+)(?:-Trk\d+)?\s.*\|'}
          uplink_lists: ['^trunk (\S+) ', '^tagged (\S+)']
          require: '^(broadcast-limit|rate-limit bcast in)\b'
    pass_if_any:
      - {edge_ports_missing: *hp_storm, absent: true}
    otherwise: unknown
    note: Needs "show interfaces brief" to know the ports.
    remediation: |
      interface <edge-ports>
         rate-limit bcast in percent 5
         exit

  LYSS-ACC-024:
    not_applicable_if_any: *hp_no_access
    # LLDP transmits by default; AOS-S does not transmit CDP (receive only)
    fail_if_any:
      - all:
          - {not: {line: '^no lldp run'}}
          - edge_ports_missing: &hp_lldp
              ports: {section: show interfaces brief, line: '^\s*([A-Z]?\d+)(?:-Trk\d+)?\s.*\|'}
              uplink_lists: ['^trunk (\S+) ', '^tagged (\S+)']
              require_lists: '^lldp admin-status (\S+) (?:rxonly|disable)'
    pass_if_any:
      - {line: '^no lldp run'}
      - {edge_ports_missing: *hp_lldp, absent: true}
    otherwise: unknown
    note: Tagged ports (uplinks, IP phones in a voice VLAN) are exempt; AOS-S only receives CDP.
    remediation: |
      lldp admin-status <edge-ports> rxonly
