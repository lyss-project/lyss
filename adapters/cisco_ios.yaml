# LYSS adapter: Cisco IOS / IOS-XE (Catalyst).
# Rule forms:
#   {line: R}                       true if any config line (top level or inside a block) matches R
#   {block: H, line: R}             true if any block whose header matches H contains a line matching R
#   {block: H, every_contains: R}   true if at least one H block exists and every one contains R
#   add where: W to a block rule    only consider H blocks that contain a line matching W
#                                   (where: [W1, W2]: blocks with a line matching each pattern)
#   add where_not: W to a block rule  only consider H blocks with no line matching W
#   {comment: R}                    true if a comment line of the configuration matches R
#   {all: [rule, ...]}              true if every sub-rule is true
#   add absent: true to a line rule true if no configuration line matches (never on an empty file)
#   add gt: N to a line rule        true only if the first regex group, as a number, is > N
#   {state: R, section: S}          true if a line of collected state section S matches R
#   add absent: true to a state rule  true if section S was collected and no line matches R
#   {ports_in_both: [A, B]}         true if some port (group 1) appears in both state tables A and B
#   {captures_in_both: [A, B]}      true if a value (group 1) is captured by both A and B, where a
#                                   capture is {line: R}, {block: H, where: W} (group 1 of the header),
#                                   {block: H, where: W, line: R}, {untagged_access_vlans: true}
#                                   (port-list platforms) or a list of these
# Per control: fail_if_any -> fail; firmware -> data/firmware.yaml; pass_if_all / pass_if_any -> pass;
# else `otherwise`. A state rule never matches when that state was not collected.
#   unknown_if_any: rules checked after fail_if_any; a match gives "unknown" with its evidence
#   (the configuration cannot decide, e.g. a link aggregation to a server or to a switch).
adapter: cisco_ios
spec_version: "1.0.0-rc.1"
platform: Cisco IOS / IOS-XE
status: stable, validated on Catalyst C1000 15.2(7)E (real devices, 2026-11)
support: stable          # stable: Level 1-2 verified on the vendor's own software; preview: not yet
tested_on: real        # real switches

facts:
  model:   {section: show inventory, line: '^PID:\s*(\S+)'}
  version: {section: show version, line: 'Version ([^,\s]+)'}

checks:

  # ---------------- Level 1 ----------------

  LYSS-MGMT-001:
    fail_if_any:
      - {block: '^line vty', line: '^transport input .*\b(telnet|all)\b'}
      - {state: ':23\s.*LISTEN', section: show control-plane host open-ports}
    pass_if_all:
      - {block: '^line vty', every_contains: '^transport input (ssh|none)\s*$'}
    otherwise: fail
    note: Without an explicit "transport input ssh", many IOS versions accept Telnet on vty lines.
    remediation: |
      line vty 0 15
       transport input ssh

  LYSS-MGMT-002:
    fail_if_any:
      - {state: '^SSH-1\.', section: ssh banner}
    pass_if_any:
      - {line: '^ip ssh version 2\s*$'}
      - {state: '^SSH-2\.0-', section: ssh banner}
    otherwise: fail
    note: Without "ip ssh version 2", IOS runs SSH 1.99 and accepts SSHv1 clients.
    remediation: |
      ip ssh version 2

  LYSS-MGMT-003:
    fail_if_any:
      - {line: '^ip http server\s*$'}
      - {state: ':80\s.*LISTEN', section: show control-plane host open-ports}
    otherwise: pass
    remediation: |
      no ip http server
      ip http secure-server   ! only if the web UI is really needed

  LYSS-MGMT-004:
    fail_if_any:
      - {block: '^line (con|vty)', line: '^exec-timeout 0( 0)?\s*$'}
      - {block: '^line (con|vty)', line: '^exec-timeout (\d+)', gt: 10}
      # "exec-timeout <minutes> <seconds>": the seconds count too ("exec-timeout 0 86400" is 24 h)
      - {block: '^line (con|vty)', line: '^exec-timeout \d+ (\d+)', gt: 600}
      - {block: '^line (con|vty)', line: '^exec-timeout 10 [1-9]'}
    otherwise: pass
    note: IOS default is 10 minutes when exec-timeout is not set.
    remediation: |
      line con 0
       exec-timeout 10 0
      line vty 0 15
       exec-timeout 10 0

  LYSS-AUTH-001:
    fail_if_any:
      - {line: '(?i)^snmp-server community (public|private)\b'}
    otherwise: pass
    remediation: |
      no snmp-server community public
      no snmp-server community private
      ! then configure SNMPv3 (LYSS-AUTH-011)

  LYSS-AUTH-002:
    fail_if_any:
      - {line: '^enable password\b'}
      # a privileged local account without any password
      - {line: '^username \S+ (.* )?nopassword\b'}
      # type 5 = MD5-crypt, type 4 = flawed unsalted SHA-256: not accepted (cracked quickly)
      - {line: '^enable (algorithm-type md5 )?secret [45] '}
      - {line: '^username \S+ (.* )?privilege 15 (.* )?(secret [45]|password) '}
    pass_if_any:
      - {line: '^enable (algorithm-type (scrypt|sha256) )?secret [89] '}
      # no enable credential at all: privilege 15 only through local accounts with a strong hash
      - {line: '^username \S+ (.* )?privilege 15 (.* )?secret [89] ', say: 'no enable credential; privileged access only through local accounts hashed with scrypt / PBKDF2-SHA-256 (secret 9 / 8)'}
    otherwise: unknown
    note: Accepted hashes are type 9 (scrypt) and type 8 (PBKDF2-SHA-256); without an enable credential, privilege 15 must come from AAA or such local users.
    remediation: |
      no enable password
      enable algorithm-type scrypt secret <new-secret>

  LYSS-AUTH-003:
    fail_if_any:
      - {line: '^username \S+ .*\bpassword\b'}
      - {line: '^username \S+ (.* )?nopassword\b', say: 'a local account has no password at all (nopassword)'}
    otherwise: pass
    note: 'A "username ... password" line is stored cleartext (type 0) or reversible (type 7); use "secret".'
    remediation: |
      username <name> privilege 15 algorithm-type scrypt secret <new-secret>
      ! then remove the old "username <name> password" line

  LYSS-AUTH-004:
    fail_if_any:
      - {block: '^(radius|tacacs) server', line: '^key (0 )?(?!(6|7) )\S'}
      - {block: '^radius server', line: '^pac key (0 )?(?!(6|7) )\S'}
      - {line: '^(radius|tacacs)-server (.* )?key (0 )?(?!(6|7) )\S'}
      # servers defined inside "aaa group server radius|tacacs+"
      - {line: '^server-private \S+ (.* )?key (0 )?(?!(6|7) )\S'}
    otherwise: pass
    note: Type 7 is not cleartext but is reversible; prefer type 6 (AES with a device master key).
    remediation: |
      key config-key password-encrypt <master-key>
      password encryption aes
      ! then rotate the shared key on the switch AND on the RADIUS server (NPS)

  LYSS-VULN-001:
    firmware: true
    otherwise: unknown
    note: Model/firmware not collected, or platform not yet in data/firmware.yaml.
    remediation: |
      ! upgrade to the latest release of the train named in the evidence
      ! (Catalyst 1000: 15.2(7)E14 or later; security fixes until 2028-04-30)
      ! until then, restrict SNMP and management access to the admin network (LYSS-MGMT-010)

  LYSS-BKP-001:
    backup: true   # vendor-neutral: evaluated from the LYSS configuration archive / attestation
    otherwise: unknown
    note: No backup evidence yet. Enable scheduled scans, or attest the external backup system on the switch page.
    remediation: |
      ! Settings > Scheduled scans (LYSS keeps every configuration version), or
      ! attest the external backup (Oxidized, RANCID...) on the switch page.

  # ---------------- Level 2 ----------------

  LYSS-AUTH-010:
    fail_if_any:
      # the default list (used by vty lines without "login authentication") must start with AAA
      - {line: '^aaa authentication login default (?!group\b)\S'}
      # a named list used by a vty line must start with AAA too
      - captures_in_both:
          - {block: '^line vty', line: '^login authentication (\S+)'}
          - {line: '^aaa authentication login (\S+) (?!group\b)\S'}
      # local accounts are the only accepted fallback: not "none" (no authentication at all when
      # the server does not answer), nor a line or enable password
      - {line: '^aaa authentication login default(?: \S+)*? (?<!group )(?:none|line|enable)\b'}
      - captures_in_both:
          - {block: '^line vty', line: '^login authentication (\S+)'}
          - {line: '^aaa authentication login (\S+)(?: \S+)*? (?<!group )(?:none|line|enable)\b'}
    pass_if_all:
      - {line: '^aaa new-model'}
      # the list the vty lines really use: the default one, or a named list on every vty line
      # (a named list that does not start with "group" already failed above)
      - any:
          - {line: '^aaa authentication login default group \S+'}
          - {block: '^line vty', every_contains: '^login authentication \S+'}
    otherwise: fail
    note: Every login list used for remote access must start with "group <radius/tacacs>", with "local" as the only fallback (not "none", "line" or "enable"); console lists are not assessed.
    remediation: |
      aaa new-model
      aaa authentication login default group <radius-group> local
      aaa authorization exec default group <radius-group> local

  LYSS-AUTH-011:
    fail_if_any:
      - {line: '^snmp-server community '}
      - {line: '^snmp-server group \S+ v(1|2c?)\b'}
      # SNMPv3 below authPriv: noauth (noAuthNoPriv) or auth (authNoPriv)
      - {line: '^snmp-server group \S+ v3 (noauth|auth)\b'}
    otherwise: pass
    remediation: |
      no snmp-server community <name>
      snmp-server group LYSS v3 priv
      snmp-server user <user> LYSS v3 auth sha <pw> priv aes 128 <pw>

  LYSS-MGMT-010:
    fail_if_any:
      # every remote management path: the web interface and SNMP too, not only the CLI lines
      - all:
          - {line: '^ip http (secure-)?server\s*$'}
          - {not: {line: '^ip http access-class '}, say: 'the web interface is enabled without "ip http access-class"'}
      - {line: '^snmp-server community \S+( view \S+)?( (RO|RW|ro|rw))?\s*$', say: 'an SNMP community without an access list'}
      - {line: '^snmp-server group \S+ v3 (?!.*\baccess\b)', say: 'an SNMPv3 group without an access list ("access <acl>")'}
    pass_if_all:
      - {block: '^line vty', every_contains: '^access-class \S+ in'}
    otherwise: fail
    note: Every management path needs a source restriction, the vty lines ("access-class"), the web interface ("ip http access-class") and SNMP (an access list on each community or group).
    remediation: |
      ip access-list standard MGMT
       permit <admin-subnet> <wildcard>
      line vty 0 15
       access-class MGMT in
      ip http access-class ipv4 MGMT
      snmp-server group <group> v3 priv access MGMT

  LYSS-MGMT-011:
    fail_if_any:
      - {block: '^interface Vlan1$', line: '^ip address (\d|dhcp)'}
      # an access port in the management VLAN puts user traffic next to the management address
      - captures_in_both:
          - {block: '^interface Vlan(\d+)$', where: '^ip address \d'}
          # also ports without "switchport mode access" (IOS default "dynamic" acts as access towards a host)
          - {block: '^interface \S*Ethernet', where_not: '^(switchport mode trunk|shutdown\s*$)', line: '^switchport access vlan (\d+)'}
    pass_if_any:
      - {block: '^interface Vlan(?!1$)\d+$', line: '^ip address \d'}
    otherwise: unknown
    remediation: |
      interface Vlan<mgmt-vlan>
       ip address <ip> <mask>
      interface Vlan1
       no ip address
       shutdown

  LYSS-MGMT-012:
    pass_if_all:
      - {line: '^banner (login|motd) '}
      # the word inside the login / MOTD banner itself (an exec banner comes after login)
      - {line: '(?i)^(banner (login|motd) |banner-text (login|motd) ).*authori[sz]ed'}
    otherwise: fail
    note: The login or MOTD banner (shown before authentication) must state the authorized-use restriction.
    remediation: |
      banner login ^Authorized access only. Activity is logged.^

  LYSS-MGMT-013:
    fail_if_any:
      - {state: '^kex: .*(sha1|group1\b)', section: ssh negotiated}
      - {state: '^cipher: .*(cbc|3des|arcfour|blowfish)', section: ssh negotiated}
      - {state: '^hostkey: (ssh-rsa|ssh-dss)\s*$', section: ssh negotiated}
    pass_if_any:
      - {state: '^kex: ', section: ssh negotiated}
    otherwise: unknown
    note: Needs the negotiated SSH algorithms (collector).
    remediation: |
      ip ssh dh min size 2048
      ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
      ip ssh server algorithm mac hmac-sha2-256 hmac-sha2-512
      ! if the image offers no SHA-2 key exchange, upgrade IOS (check "ip ssh server algorithm kex ?")

  LYSS-LOG-010:
    fail_if_any:
      - {line: '^no logging on\b', say: 'logging is disabled globally ("no logging on"): nothing reaches the syslog hosts'}
      - {line: '^no logging trap\b', say: 'forwarding to the syslog hosts is turned off ("no logging trap")'}
    pass_if_any:
      - {line: '^logging (host )?\d+\.\d+\.\d+\.\d+'}
    otherwise: fail
    remediation: |
      logging host <siem-ip>
      logging trap informational

  LYSS-LOG-011:
    fail_if_any:
      - {state: '(?i)\bunsynchroni[sz]ed\b', section: show ntp status}
      - {line: '^ntp server ', absent: true, say: 'no NTP server configured'}
    pass_if_all:
      - {line: '^ntp server '}
      - {state: '(?i)\bunsynchroni[sz]ed\b', section: show ntp status, absent: true}
    otherwise: unknown
    note: Synchronization is checked with "show ntp status"; without device state the verdict is unknown.
    remediation: |
      ntp server <ntp-ip>

  LYSS-ACC-010:
    fail_if_any:
      - {state: '\bnotconnect\b', section: show interfaces status}
    pass_if_any:
      - {state: '.', section: show interfaces status}
    otherwise: unknown
    note: Needs "show interfaces status" (notconnect = enabled but unused; disabled = shut).
    remediation: |
      interface range <unused-ports>
       shutdown
       switchport access vlan <parking-vlan>

  LYSS-ACC-011:
    pass_if_any:
      - {line: '^spanning-tree portfast (edge )?bpduguard default'}
      # an access-mode port-channel (e.g. to a server) is an edge port, checked on the port-channel
      # itself; its members ("channel-group") are not checked one by one
      # also ports without "switchport mode access": the IOS default (dynamic) acts as an access
      # port towards a host. Disabled ports are not access ports.
      - {block: '^interface (\S*Ethernet|Port-channel)', where_not: '^(switchport mode trunk|no switchport|channel-group\b|shutdown\s*$)', every_contains: '^spanning-tree bpduguard enable'}
    otherwise: fail
    remediation: |
      spanning-tree portfast edge bpduguard default

  # ---------------- Level 3 ----------------
  # access ports = "switchport mode access" interfaces (as for LYSS-ACC-011); an access port
  # without "switchport access vlan" is in VLAN 1

  LYSS-ACC-020:
    not_applicable_if_any: &ios_no_access
      - {not: {block: '^interface \S*Ethernet', where: '^switchport mode access', where_not: '^shutdown$'}, say: 'no enabled access port ("switchport mode access") in the configuration'}
    fail_if_any:
      - {not: {line: '^ip dhcp snooping\s*$'}, say: 'DHCP snooping is not enabled globally ("ip dhcp snooping")'}
      # a trusted access port accepts DHCP server messages: a rogue server there is not blocked
      - {block: '^interface \S*Ethernet', where: '^switchport mode access', where_not: '^shutdown$', line: '^ip dhcp snooping trust\b'}
      - uncovered: &ios_snooping
          what: access VLANs without DHCP snooping
          used: &ios_access_vlans {block: '^interface \S*Ethernet', where: '^switchport mode access', where_not: '^shutdown$', line: '^switchport access vlan (\d+)', default: 1}
          covered: {line: '^ip dhcp snooping vlan (\S+)'}
          lists: true
    pass_if_any:
      - {uncovered: *ios_snooping, absent: true}
    otherwise: fail
    remediation: |
      ip dhcp snooping
      ip dhcp snooping vlan <access-vlans>
      interface <uplink>
       ip dhcp snooping trust

  LYSS-ACC-021:
    not_applicable_if_any: *ios_no_access
    fail_if_any:
      # a trusted access port skips ARP inspection
      - {block: '^interface \S*Ethernet', where: '^switchport mode access', where_not: '^shutdown$', line: '^ip arp inspection trust\b'}
      - uncovered: &ios_dai
          what: access VLANs without ARP inspection
          used: *ios_access_vlans
          covered: {line: '^ip arp inspection vlan (\S+)'}
          lists: true
    pass_if_any:
      - {uncovered: *ios_dai, absent: true}
    otherwise: fail
    note: ARP inspection checks ARP packets against the DHCP snooping bindings (LYSS-ACC-020) or ARP access lists for static hosts.
    remediation: |
      ip arp inspection vlan <access-vlans>
      interface <uplink>
       ip arp inspection trust

  LYSS-ACC-022:
    not_applicable_if_any: *ios_no_access
    fail_if_any:
      - {not: {line: '^dot1x system-auth-control'}, say: '802.1X is not enabled globally ("dot1x system-auth-control")'}
      # open mode forwards traffic before (and without) successful authentication
      - {block: '^interface \S*Ethernet', where: '^switchport mode access', where_not: '^shutdown$', line: '^authentication open\b'}
      - uncovered: &ios_nac
          what: access ports without 802.1X / MAB
          used: &ios_access_ports {block: '^interface (\S*Ethernet\S+)', where: '^switchport mode access', where_not: '^shutdown$'}
          covered: {block: '^interface (\S*Ethernet\S+)', where: '^((authentication|access-session|dot1x) port-control auto|mab)\b'}
    pass_if_any:
      - {uncovered: *ios_nac, absent: true}
    otherwise: fail
    remediation: |
      aaa new-model
      aaa authentication dot1x default group <radius-group>
      dot1x system-auth-control
      interface range <access-ports>
       authentication port-control auto
       dot1x pae authenticator
       mab

  LYSS-ACC-023:
    not_applicable_if_any: *ios_no_access
    fail_if_any:
      # a 100 % threshold limits nothing
      - {block: '^interface \S*Ethernet', where: '^switchport mode access', where_not: '^shutdown$', line: '^storm-control broadcast level 100(?:\.0+)?(?:\s|$)'}
      - uncovered: &ios_storm
          what: access ports without broadcast storm control
          used: *ios_access_ports
          covered: {block: '^interface (\S*Ethernet\S+)', where: '^storm-control broadcast level'}
    pass_if_any:
      - {uncovered: *ios_storm, absent: true}
    otherwise: fail
    remediation: |
      interface range <access-ports>
       storm-control broadcast level 5.00

  LYSS-ACC-024:
    # CDP is on by default; LLDP only with "lldp run". Ports with a voice VLAN keep them (IP phones).
    not_applicable_if_any: *ios_no_access
    fail_if_any:
      - all:
          - {not: {line: '^no cdp run'}}
          - uncovered: &ios_cdp
              what: access ports sending CDP
              used: &ios_user_ports {block: '^interface (\S*Ethernet\S+)', where: '^switchport mode access', where_not: '^(switchport voice vlan|shutdown$)'}
              covered: {block: '^interface (\S*Ethernet\S+)', where: '^no cdp enable'}
      - all:
          - {line: '^lldp run'}
          - uncovered: &ios_lldp
              what: access ports sending LLDP
              used: *ios_user_ports
              covered: {block: '^interface (\S*Ethernet\S+)', where: '^no lldp transmit'}
    otherwise: pass
    note: Access ports with a voice VLAN are exempt (IP phones need CDP or LLDP-MED).
    remediation: |
      interface range <user-access-ports>
       no cdp enable
       no lldp transmit
      ! or, if no device needs CDP at all: no cdp run
