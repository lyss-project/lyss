# LYSS adapter: Cisco Small Business (SG200/SG300/SG350/SG500, CBS250/CBS350).
# Rule forms: see adapters/cisco_ios.yaml.
# Cisco SB "show running-config" omits most defaults, and defaults change between
# families and firmware versions, so config-only checks often end as "unknown";
# device state (tools/Collect-State.ps1) resolves them.
adapter: cisco_sb
spec_version: "0.6.0-draft"
platform: Cisco Small Business / Business switches
status: draft, validated on SG300 1.4.11.5, SRW2024P, SG350 2.5.0.83 (real devices, 2026-11)

facts:
  model:
    - {section: show inventory, line: '^PID:\s*(\S+)'}
    # firmware older than 1.4 has no "show inventory"; sysObjectID 9.6.1.83.<ports> = 300 Series
    - {section: show system, line: '^System Object ID:\s+1\.3\.6\.1\.4\.1\.9\.6\.1\.83\.(\d+)\.', format: 'SG300-{0} (from sysObjectID)'}
  version: {section: show version, line: '^\s*(?:SW version|Version:)\s+(\d[\d.]+)'}

checks:

  # ---------------- Level 1 ----------------

  LYSS-MGMT-001:
    fail_if_any:
      - {line: '^ip telnet server\s*$'}
      - {state: '^TCP6?\s+All[:-]23\s.*listen', section: show services tcp-udp}
    pass_if_any:
      - {line: '^no ip telnet server\s*$'}
      - {state: '^TCP6?\s+All[:-]23\s', section: show services tcp-udp, absent: true}
    otherwise: unknown
    note: Telnet default differs by family/firmware; collect "show services tcp-udp".
    remediation: |
      no ip telnet server

  LYSS-MGMT-002:
    fail_if_any:
      - {state: '^SSH-1\.', section: ssh banner}
    pass_if_any:
      - {state: '^SSH-2\.0-', section: ssh banner}
    otherwise: unknown
    note: SSH protocol version is not in the config; collect the SSH banner.
    remediation: |
      ! upgrade firmware if SSHv1 (SSH-1.99) is still offered

  LYSS-MGMT-003:
    fail_if_any:
      - {state: '^TCP6?\s+All[:-]80\s.*listen', section: show services tcp-udp}
    pass_if_any:
      - {line: '^no ip http server\s*$'}
    otherwise: fail
    note: HTTP web management is enabled by default on Cisco SB switches.
    remediation: |
      no ip http server
      ip http secure-server   ! HTTPS (Cisco SB syntax)

  LYSS-MGMT-004:
    fail_if_any:
      - {block: '^line (console|telnet|ssh)', line: '^exec-timeout 0\s*$'}
      - {block: '^line (console|telnet|ssh)', line: '^exec-timeout (\d+)', gt: 10}
    otherwise: pass
    note: Default idle timeout is 10 minutes.
    remediation: |
      line ssh
       exec-timeout 10
      exit
      line console
       exec-timeout 10
      exit

  LYSS-AUTH-001:
    fail_if_any:
      - {line: '(?i)^snmp-server community (public|private)\b'}
    otherwise: pass
    remediation: |
      no snmp-server community public
      no snmp-server community private

  LYSS-AUTH-002:
    fail_if_any:
      # cleartext enable password
      - {line: '^enable password (?:level \d+ )?(?!level\b|encrypted\b)\S'}
      # "encrypted" value of 40 hex digits = unsalted SHA-1 (SG200/300/350/500 families)
      - {line: '^enable password (?:level \d+ )?encrypted [0-9a-fA-F]{40}\b'}
      - {line: '^username \S+ password (encrypted [0-9a-fA-F]{40}\b|(?!encrypted\b)\S).*\bprivilege 15\b'}
    pass_if_any:
      - {line: '^aaa authentication enable (?:authorization )?\S+ (radius|tacacs)\b', say: 'privileged access is authenticated by RADIUS/TACACS+ first, and no weakly stored privileged credential is configured'}
    otherwise: unknown
    note: >-
      SG200/300/350/500 store "encrypted" passwords as unsalted SHA-1 (40 hex digits), which this control
      does not accept; other formats are not identified yet. Authenticate privileged access with
      RADIUS/TACACS+ and keep any local privileged account as an emergency fallback.
    remediation: |
      aaa authentication enable authorization default radius enable
      ! keep one local privilege-15 account for emergencies only; newer Cisco Business firmware
      ! may store it with a stronger algorithm (check the value format after an upgrade)

  LYSS-AUTH-003:
    fail_if_any:
      - {line: '^username \S+ password (?!encrypted\b)\S'}
    otherwise: pass
    remediation: |
      username <name> password <new-secret> privilege 15   ! stored hashed by the switch

  LYSS-AUTH-004:
    fail_if_any:
      - {line: '^(radius|tacacs)-server .*(?<!encrypted-)\bkey \S'}
    otherwise: pass
    note: Cisco SB stores keys as "encrypted-key" unless entered as a plain "key".
    remediation: |
      radius-server host <ip> key <new-key>   ! re-enter; shown afterwards as encrypted-key
      ! rotate the key on the RADIUS server too

  LYSS-VULN-001:
    firmware: true
    otherwise: unknown
    note: Model/firmware not collected, or platform not yet in data/firmware.yaml.
    remediation: |
      ! still supported 250/350/350X/550X: upgrade to the latest 2.5.9.x (>= 2.5.9.16); CBS: >= 3.3.0.16
      ! past end of support (200/300/500, SRW, SG350-52P/28P/10P since 2026-10-31): plan the replacement,
      ! and meanwhile disable the web UI (no ip http server / no ip http secure-server) and restrict
      ! management access to the admin network (LYSS-MGMT-010)

  LYSS-BKP-001:
    backup: true   # vendor-neutral: evaluated from the LYSS configuration archive / attestation
    otherwise: unknown
    note: No backup evidence yet. Enable scheduled scans, or attest the external backup system on the switch page.
    remediation: |
      ! Settings > Scheduled scans (LYSS keeps every configuration version), or
      ! attest the external backup (Oxidized, RANCID...) on the switch page.

  # ---------------- Level 2 ----------------

  LYSS-AUTH-010:
    fail_if_any:
      - {line: '^aaa authentication login (?:authorization )?default (?!radius\b|tacacs\b)\S'}
      - captures_in_both:
          - {block: '^line (ssh|telnet)', line: '^login authentication (\S+)'}
          - {line: '^aaa authentication login (?:authorization )?(\S+) (?!radius\b|tacacs\b)\S'}
    pass_if_all:
      - {line: '^aaa authentication login (?:authorization )?\S+ (radius|tacacs)\b'}
      - {line: '^(radius|tacacs)-server host '}
    otherwise: fail
    note: Logins must try RADIUS/TACACS+ first; "local radius" only uses RADIUS for unknown users.
    remediation: |
      radius-server host <nps-ip> key <key>
      aaa authentication login authorization default radius local
      aaa authentication enable authorization default radius enable
      line ssh
       login authentication default
      exit

  LYSS-AUTH-011:
    fail_if_any:
      - {line: '^snmp-server community '}
      - {line: '^snmp-server group \S+ v(1|2)\b'}
      # SNMPv3 below authPriv: noauth (noAuthNoPriv) or auth (authNoPriv)
      - {line: '^snmp-server group \S+ v3 (noauth|auth)\b'}
    otherwise: pass
    remediation: |
      no snmp-server community <name>
      snmp-server group LYSS v3 priv read Default
      snmp-server user <user> LYSS v3 auth sha <pw> priv <pw>

  LYSS-MGMT-010:
    pass_if_all:
      - {line: '^management access-class \S+'}
    otherwise: fail
    remediation: |
      management access-list MGMT
       permit ip-source <admin-subnet> mask <mask>
      exit
      management access-class MGMT

  LYSS-MGMT-011:
    fail_if_any:
      - {block: '^interface vlan 1$', line: '^ip address (\d|dhcp)'}
      - captures_in_both:
          - {block: '^interface vlan (\d+)$', where: '^ip address \d'}
          - {block: '(?i)^interface (?:gi|te|fa)', line: '^switchport access vlan (\d+)'}
    pass_if_any:
      - {block: '^interface vlan (?!1$)\d+$', line: '^ip address \d'}
    otherwise: unknown
    remediation: |
      interface vlan <mgmt-vlan>
       ip address <ip> <mask>
      exit
      ! then remove the VLAN 1 address once the new one is reachable

  LYSS-MGMT-012:
    pass_if_all:
      - {line: '^banner (login|motd)\b'}
      - {line: '(?i)authori[sz]ed'}
    otherwise: fail
    note: Only login/MOTD banners are shown before authentication ("banner exec" comes after login).
    remediation: |
      banner login ^
      Authorized access only. Activity is logged.
      ^

  LYSS-MGMT-013:
    fail_if_any: &weak_ssh
      - {state: '^kex: .*(sha1|group1\b)', section: ssh negotiated}
      - {state: '^cipher: .*(cbc|3des|arcfour|blowfish)', section: ssh negotiated}
      - {state: '^hostkey: (ssh-rsa|ssh-dss)\s*$', section: ssh negotiated}
    pass_if_any:
      - {state: '^kex: ', section: ssh negotiated}
    otherwise: unknown
    note: Needs the negotiated SSH algorithms (collector).
    remediation: |
      ! Cisco SB: SHA-2 key exchange needs recent firmware (250/350: latest 2.5.9.x);
      ! the 200/300/500 series cannot be fixed -> plan replacement, and meanwhile
      ! restrict management access (LYSS-MGMT-010) to the admin network only.
      crypto key generate rsa   ! regenerate a 2048-bit key after upgrading

  LYSS-LOG-010:
    fail_if_any:
      - {line: '^no logging on\b', say: 'logging is disabled globally ("no logging on"): nothing reaches the syslog hosts'}
    pass_if_any:
      - {line: '^logging host \S+'}
    otherwise: fail
    remediation: |
      logging host <siem-ip> severity informational

  LYSS-LOG-011:
    fail_if_any:
      - {state: '(?i)\bunsynchroni[sz]ed\b|\bnot synchroni[sz]ed\b', section: show sntp status}
    pass_if_any:
      - {line: '^sntp server \S+'}
    otherwise: fail
    note: Synchronization is checked with "show sntp status"; without device state, a configured server passes.
    remediation: |
      clock source sntp
      sntp unicast client enable
      sntp server <ntp-ip> poll

  LYSS-ACC-010:
    fail_if_any:
      - ports_in_both:
          - {section: show interfaces status, line: '^((?:gi|te|fa)\S+)\s.*\sDown\s'}
          - {section: show interfaces configuration, line: '^((?:gi|te|fa)\S+)\s.*\sUp\s+\S+\s+\S+\s*$'}
    pass_if_any:
      - {state: '.', section: show interfaces configuration}
    otherwise: unknown
    note: Needs "show interfaces status" and "show interfaces configuration".
    remediation: |
      interface range <unused-ports>
       shutdown
       switchport access vlan <parking-vlan>
      exit

  LYSS-ACC-011:
    # edge ports = every port minus trunk/general/LAG ports in the config. Neighbour discovery
    # (LLDP/CDP) never exempts a port: a rogue device can advertise bridge capability.
    fail_if_any:
      - edge_ports_missing: &edge
          ports: {section: show interfaces status, line: '^((?:gi|te|fa)\S+)\s'}
          uplink_config: '^(switchport mode (trunk|general)|channel-group)\b'
          require: '^spanning-tree bpduguard enable'
    pass_if_any:
      - {edge_ports_missing: *edge, absent: true}
    otherwise: unknown
    note: Needs "show interfaces status"; links to other switches must be configured as trunk/general or LAG members.
    remediation: |
      ! only on edge ports (users, printers, APs, servers) - never on links to other switches
      interface range <edge-ports>
       spanning-tree bpduguard enable
      exit

  # ---------------- Level 3 ----------------
  # Syntax from the Cisco Business 350 CLI guide; not yet checked on a real switch with these
  # features enabled (reports welcome). Edge ports as for LYSS-ACC-011 (need "show interfaces status").

  LYSS-ACC-020:
    fail_if_any:
      - {not: {line: '^ip dhcp snooping\s*$'}, say: 'DHCP snooping is not enabled globally ("ip dhcp snooping")'}
      - uncovered: &sb_snooping
          what: access VLANs without DHCP snooping
          used: &sb_access_vlans {block: '(?i)^interface (?:gi|te|fa|gigabitethernet|tengigabitethernet|fastethernet)', where_not: '^(switchport mode (trunk|general)|channel-group)\b', line: '^switchport access vlan (\d+)', default: 1}
          covered: {line: '^ip dhcp snooping vlan (\S+)'}
          lists: true
    pass_if_any:
      - {uncovered: *sb_snooping, absent: true}
    otherwise: fail
    note: VLANs are read from the interfaces listed in the configuration; ports never configured stay in VLAN 1 and are not counted.
    remediation: |
      ip dhcp snooping
      ip dhcp snooping vlan <access-vlan>
      interface <uplink>
       ip dhcp snooping trust
      exit

  LYSS-ACC-021:
    fail_if_any:
      - {not: {line: '^ip arp inspection\s*$'}, say: 'ARP inspection is not enabled globally ("ip arp inspection")'}
      - uncovered: &sb_dai
          what: access VLANs without ARP inspection
          used: *sb_access_vlans
          covered: {line: '^ip arp inspection vlan (\S+)'}
          lists: true
    pass_if_any:
      - {uncovered: *sb_dai, absent: true}
    otherwise: fail
    remediation: |
      ip arp inspection
      ip arp inspection vlan <access-vlan>
      interface <uplink>
       ip arp inspection trust
      exit

  LYSS-ACC-022:
    fail_if_any:
      - {not: {line: '^dot1x system-auth-control'}, say: '802.1X is not enabled globally ("dot1x system-auth-control")'}
      - edge_ports_missing: &sb_nac
          ports: {section: show interfaces status, line: '^((?:gi|te|fa)\S+)\s'}
          uplink_config: '^(switchport mode (trunk|general)|channel-group)\b'
          require: '^dot1x (port-control (auto|mac-and-802\.1x|mac-only)|authentication\b.*\bmac)'
    pass_if_any:
      - {edge_ports_missing: *sb_nac, absent: true}
    otherwise: unknown
    note: Needs "show interfaces status" to know the edge ports.
    remediation: |
      dot1x system-auth-control
      interface range <edge-ports>
       dot1x port-control auto
      exit

  LYSS-ACC-023:
    fail_if_any:
      - edge_ports_missing: &sb_storm
          ports: {section: show interfaces status, line: '^((?:gi|te|fa)\S+)\s'}
          uplink_config: '^(switchport mode (trunk|general)|channel-group)\b'
          require: '^storm-control broadcast (enable|level)\b'
    pass_if_any:
      - {edge_ports_missing: *sb_storm, absent: true}
    otherwise: unknown
    note: Needs "show interfaces status" to know the edge ports.
    remediation: |
      interface range <edge-ports>
       storm-control broadcast enable
       storm-control broadcast level 5
      exit

  LYSS-ACC-024:
    # LLDP and CDP are both on by default; ports in a voice VLAN keep them (IP phones)
    fail_if_any:
      - all:
          - {not: {line: '^no lldp run'}}
          - edge_ports_missing: &sb_lldp
              ports: {section: show interfaces status, line: '^((?:gi|te|fa)\S+)\s'}
              uplink_config: '^(switchport mode (trunk|general)|channel-group|switchport voice vlan|voice vlan enable)\b'
              require: '^no lldp transmit'
      - all:
          - {not: {line: '^no cdp run'}}
          - edge_ports_missing: &sb_cdp
              ports: {section: show interfaces status, line: '^((?:gi|te|fa)\S+)\s'}
              uplink_config: '^(switchport mode (trunk|general)|channel-group|switchport voice vlan|voice vlan enable)\b'
              require: '^no cdp enable'
    pass_if_all:
      - any: [{line: '^no lldp run'}, {edge_ports_missing: *sb_lldp, absent: true}]
      - any: [{line: '^no cdp run'}, {edge_ports_missing: *sb_cdp, absent: true}]
    otherwise: unknown
    note: Needs "show interfaces status" unless LLDP and CDP are disabled globally; voice-VLAN ports are exempt.
    remediation: |
      interface range <user-edge-ports>
       no lldp transmit
       no cdp enable
      exit
