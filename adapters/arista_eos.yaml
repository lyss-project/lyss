# LYSS adapter: Arista EOS (7000 series, cEOS / vEOS).
# Rule forms: see adapters/cisco_ios.yaml. EOS "show running-config" lists non-default settings;
# management services live in "management ssh | telnet | console | api http-commands" blocks.
# Defaults this adapter relies on (Arista EOS manual, "Connection Management", checked on cEOS
# 4.37): Telnet and eAPI are disabled, SSH (v2 only) is enabled, SSH / console sessions never time
# out (idle-timeout 0), and default settings ("idle-timeout 0", "protocol https",
# "aaa authentication login default local") are not shown in the running configuration.
# A fresh EOS has no user account and no enable password. Read-only LYSS account:
#   username lyss-audit privilege 15 role network-operator secret <password>
#   aaa authorization commands all default local      ! roles are enforced only with this
adapter: arista_eos
spec_version: "0.8.1-draft"
platform: Arista EOS
status: stable, validated on cEOS-lab 4.37.0F (container, 2026-11)
support: stable          # stable: Level 1-2 verified on the vendor's own software; preview: not yet
tested_on: virtual        # cEOS-lab 4.37.0F

facts:
  model:
    - {section: show version, line: '^(?:Arista )?(DCS-\S+|CCS-\S+|cEOSLab|vEOS(?:-lab)?)\s*$'}
    - {section: show version, line: '^Arista (\S+)'}
    - {section: config comments, line: '^!\s*device:\s*\S+\s*\(([^,)]+),'}
  version:
    # "4.37.0F-51574443.4370F.1 (engineering build)" -> 4.37.0F
    - {section: show version, line: '^Software image version:\s*(\d+\.\d+\.\d+\w*)'}
    - {section: config comments, line: '^!\s*device:\s*\S+\s*\([^,)]*,\s*EOS-([\w.]+)'}

checks:

  # ---------------- Level 1 ----------------

  LYSS-MGMT-001:
    fail_if_any:
      - {block: '^management telnet$', line: '^no shutdown\s*$'}
      # EOS 4.37: "Telnet status for Default VRF is enabled"
      - {state: '(?i)^telnet status\b.*\bis enabled\b', section: show management telnet}
    otherwise: pass
    note: Telnet is disabled by default on EOS; it runs only with "management telnet / no shutdown".
    remediation: |
      management telnet
         shutdown

  LYSS-MGMT-002:
    fail_if_any:
      - {state: '^SSH-1\.', section: ssh banner}
    otherwise: pass
    note: EOS supports SSH protocol version 2 only.
    remediation: |
      ! nothing to configure: EOS offers SSH version 2 only

  LYSS-MGMT-003:
    fail_if_any:
      # eAPI enabled with plain HTTP (eAPI and HTTP are off by default)
      - {block: '^management api http-commands$', where: '^no shutdown\s*$', line: '^protocol http(\s+port\s+\d+)?\s*$'}
      - all:
          - {block: '^management http-server$', line: '^protocol http(\s+port\s+\d+)?\s*$'}
          - {block: '^management api http-commands$', line: '^no shutdown\s*$'}
    otherwise: pass
    note: '"protocol http localhost" (local access only) is accepted.'
    remediation: |
      management api http-commands
         no protocol http
         protocol https
      ! or, if eAPI is not used:
      management api http-commands
         shutdown

  LYSS-MGMT-004:
    fail_if_any:
      - {block: '^management (ssh|console)$', line: '^idle-timeout 0\s*$'}
      - {block: '^management (ssh|console)$', line: '^idle-timeout (\d+)', gt: 10}
    pass_if_all:
      - {block: '^management ssh$', line: '^idle-timeout ([1-9]|10)\s*$'}
      - {block: '^management console$', line: '^idle-timeout ([1-9]|10)\s*$'}
    otherwise: fail
    note: The EOS default is idle-timeout 0 (sessions never time out); SSH and console both need 1-10 minutes.
    remediation: |
      management ssh
         idle-timeout 10
      management console
         idle-timeout 10

  LYSS-AUTH-001:
    fail_if_any:
      - {line: '(?i)^snmp-server community (public|private)\b'}
    otherwise: pass
    remediation: |
      no snmp-server community public
      no snmp-server community private
      ! then configure SNMPv3 (LYSS-AUTH-011)

  LYSS-AUTH-002:
    fail_if_any:
      # 0 = cleartext, 5 / md5 = MD5-crypt (cracked quickly)
      - {line: '^enable (password|secret) (0|5|md5) '}
      - {line: '^username \S+ (.* )?privilege 15 (.* )?nopassword\b', say: 'a privilege-15 account is configured with "nopassword": no credential at all'}
      - {line: '^username \S+ (.* )?privilege 15 (.* )?secret (0|5|md5) '}
    pass_if_any:
      - {line: '^enable (password|secret) sha512 '}
      # no enable password: privilege 15 only through local accounts with a SHA-512 crypt hash
      - {line: '^username \S+ (.* )?privilege 15 (.* )?secret sha512 ', say: 'no enable password; privileged access only through local accounts hashed with SHA-512 crypt'}
    otherwise: unknown
    note: EOS hashes new passwords with SHA-512 crypt ("sha512"); MD5-crypt ("5") and accounts without a password do not pass.
    remediation: |
      enable password <new-password>      ! stored as "sha512"
      username <name> privilege 15 role network-admin secret <new-password>
      ! remove "nopassword" accounts or give them a password

  LYSS-AUTH-003:
    fail_if_any:
      - {line: '^username \S+ .*\bsecret (0|7) '}
      - {line: '^enable (password|secret) 0 '}
    otherwise: pass
    note: EOS stores local passwords as one-way hashes (SHA-512 or MD5 crypt), never reversible.
    remediation: |
      username <name> secret <new-password>

  LYSS-AUTH-004:
    fail_if_any:
      - {line: '^(radius|tacacs)-server (.* )?key (0 )?(?!(7|8a) )\S'}
    otherwise: pass
    note: EOS converts RADIUS / TACACS+ keys typed in clear to type 7 (reversible, not cleartext); checked on cEOS 4.37.
    remediation: |
      ! re-enter the key: EOS stores it as type 7
      tacacs-server host <tacacs-ip> key <key>
      ! type 7 is reversible: protect configuration backups like the switch itself

  LYSS-VULN-001:
    firmware: true
    otherwise: unknown
    note: >-
      Firmware version not collected (no "show version" and no "! device:" header). Version data
      covers the critical EOS advisories with fixed releases (SA-0071, SA-0072). The one EOS flaw in
      the CISA KEV catalogue (CVE-2026-7473, SA-0137) has no fixed release and is not decided by
      version: on 7020R / 7280R(2) / 7500R(2) tunnel endpoints (VXLAN, GRE, decap-group) apply the
      ACL of the advisory.
    remediation: |
      ! upgrade to the latest release of your EOS train (arista.com > Support > Software Download)
      ! VXLAN / GRE endpoints on 7020R, 7280R(2), 7500R(2): apply the ACL of Security Advisory 0137

  LYSS-BKP-001:
    backup: true
    otherwise: unknown
    note: No backup evidence yet. Enable scheduled scans, or attest the external backup system on the switch page.
    remediation: |
      ! Settings > Scheduled scans (LYSS keeps every configuration version), or
      ! attest the external backup (Oxidized, CloudVision...) on the switch page.

  # ---------------- Level 2 ----------------

  LYSS-AUTH-010:
    fail_if_any:
      - {line: '^aaa authentication login default (?!group\b)\S'}
      # local accounts are the only accepted fallback (not "none")
      - {line: '^aaa authentication login default(?: \S+)*? (?<!group )none\b'}
    pass_if_all:
      - {line: '^aaa authentication login default group \S+'}
    otherwise: fail
    note: Without "aaa authentication login default group ...", EOS authenticates with local accounts only; "local" must be the only fallback. Console lists are not assessed.
    remediation: |
      tacacs-server host <tacacs-ip> key <key>
      aaa group server tacacs+ TACACS
         server <tacacs-ip>
      aaa authentication login default group TACACS local
      aaa authorization exec default group TACACS local

  LYSS-AUTH-011:
    fail_if_any:
      - {line: '^snmp-server community '}
      - {line: '^snmp-server group \S+ v(1|2c?)\b'}
      - {line: '^snmp-server group \S+ v3 (noauth|auth)\b'}
    otherwise: pass
    remediation: |
      no snmp-server community <name>
      snmp-server group LYSS v3 priv
      snmp-server user <user> LYSS v3 auth sha256 <pw> priv aes <pw>

  LYSS-MGMT-010:
    fail_if_any:
      # eAPI needs the control-plane ACL (which covers every service); SNMP may have its own
      - all:
          - {not: {block: '^system control-plane$', line: '^ip access-group \S+ (vrf \S+ )?in\s*$'}}
          - {block: '^management api http-commands$', line: '^no shutdown\s*$', say: 'eAPI is enabled without a control-plane access list'}
      - all:
          - {not: {block: '^system control-plane$', line: '^ip access-group \S+ (vrf \S+ )?in\s*$'}}
          - {not: {line: '^snmp-server (ipv4 access-list \S+|community \S+ (ro|rw) \S+)'}}
          - {line: '^snmp-server (community|group|user) ', say: 'SNMP is configured without an access list'}
    pass_if_any:
      - {block: '^management ssh$', line: '^ip access-group \S+ (vrf \S+ )?in\s*$'}
      - {block: '^system control-plane$', line: '^ip access-group \S+ (vrf \S+ )?in\s*$'}
    otherwise: fail
    note: 'The default control-plane ACL accepts SSH from any address: apply an ACL to "management ssh" or the control plane.'
    remediation: |
      ip access-list MGMT
         10 permit tcp <admin-subnet> any eq ssh
      management ssh
         ip access-group MGMT in

  LYSS-MGMT-011:
    fail_if_any:
      - {block: '^interface Vlan1$', line: '^ip address \d'}
      - captures_in_both:
          - {block: '^interface Vlan(\d+)$', where: '^ip address \d'}
          # EOS switchports are access ports unless "switchport mode trunk" (mode access is not shown)
          - {block: '^interface Ethernet', where_not: '^(switchport mode (trunk|routed)|no switchport|shutdown)\b', line: '^switchport access vlan (\d+)'}
    pass_if_any:
      - {block: '^interface Management\d', line: '^ip address \d', say: 'out-of-band management port (Management interface) addressed'}
      - {block: '^interface Vlan(?!1$)\d+$', line: '^ip address \d'}
    otherwise: unknown
    remediation: |
      interface Management1
         ip address <ip>/<prefix>
      ! or an in-band management VLAN that no access port uses
      interface Vlan1
         no ip address

  LYSS-MGMT-012:
    pass_if_all:
      - {line: '^banner (login|motd)\s*$'}
      # the word inside the banner text itself
      - {line: '(?i)^banner-text (login|motd) .*authori[sz]ed'}
    otherwise: fail
    note: The login banner is shown before authentication; it must state the authorized-use restriction.
    remediation: |
      banner login
      Authorized access only. Activity is logged.
      EOF

  LYSS-MGMT-013:
    fail_if_any:
      - {state: '^kex: .*(sha1|group1\b)', section: ssh negotiated}
      - {state: '^cipher: .*(cbc|3des|arcfour|blowfish)', section: ssh negotiated}
      - {state: '^hostkey: (ssh-rsa|ssh-dss)\s*$', section: ssh negotiated}
    pass_if_any:
      - {state: '^kex: ', section: ssh negotiated}
    otherwise: unknown
    note: Needs the negotiated SSH algorithms (collector).
    remediation: |
      management ssh
         cipher aes256-gcm@openssh.com aes256-ctr aes128-ctr
         key-exchange curve25519-sha256 ecdh-sha2-nistp256 diffie-hellman-group16-sha512
         mac hmac-sha2-512 hmac-sha2-256

  LYSS-LOG-010:
    fail_if_any:
      - {line: '^no logging on\b', say: 'logging is disabled globally ("no logging on"): nothing reaches the syslog hosts'}
    pass_if_any:
      - {line: '^logging (vrf \S+ )?host \S+'}
    otherwise: fail
    remediation: |
      logging host <siem-ip>
      logging trap informational

  LYSS-LOG-011:
    fail_if_any:
      - {state: '(?i)\bunsynchroni[sz]ed\b', section: show ntp status}
      - {line: '^ntp server (vrf \S+ )?\S+', absent: true, say: 'no NTP server configured'}
    pass_if_all:
      - {line: '^ntp server (vrf \S+ )?\S+'}
      - {state: '(?i)\bunsynchroni[sz]ed\b', section: show ntp status, absent: true}
    otherwise: unknown
    note: Synchronization is checked with "show ntp status"; without device state the verdict is unknown.
    remediation: |
      ntp server <ntp-ip>

  LYSS-ACC-010:
    fail_if_any:
      - {state: '\bnotconnect\b', section: show interfaces status}
    pass_if_any:
      - {state: '.', section: show interfaces status}
    otherwise: unknown
    note: Needs "show interfaces status" (notconnect = enabled but unused; disabled = shut).
    remediation: |
      interface <unused-ports>
         shutdown

  LYSS-ACC-011:
    pass_if_any:
      - {line: '^spanning-tree edge-port bpduguard default'}
      # a Port-Channel that is not a trunk (e.g. to a server) is an edge port, checked on the
      # Port-Channel itself; its members ("channel-group") are not checked one by one
      - {block: '^interface (Ethernet|Port-Channel)', where_not: '^(switchport mode (trunk|routed)|no switchport|channel-group|shutdown)\b', every_contains: '^spanning-tree bpduguard enable'}
    otherwise: fail
    remediation: |
      spanning-tree edge-port bpduguard default
      interface <access-ports>
         spanning-tree portfast

  # ---------------- Level 3 ----------------
  # cEOS-lab 4.37 accepts "dot1x system-auth-control", "dot1x port-control auto" and
  # "no lldp transmit"; DHCP snooping, ARP inspection, storm control and MAC-based authentication
  # need switching hardware ("not supported on this hardware platform" in a container): their
  # syntax follows the Arista EOS manual and the DISA STIG (Arista MLS EOS 4.x L2S).
  # access ports = Ethernet interfaces that are not trunks, routed ports or LAG members (as for
  # LYSS-ACC-011); EOS switchports are access ports in VLAN 1 unless configured otherwise.

  LYSS-ACC-020:
    not_applicable_if_any: &eos_no_access
      - {not: {block: '^interface Ethernet', where_not: '^(switchport mode (trunk|routed)|no switchport|channel-group|shutdown)\b'}, say: 'no enabled access port (every Ethernet interface is shut, a trunk, routed or LAG member)'}
    fail_if_any:
      - {not: {line: '^ip dhcp snooping\s*$'}, say: 'DHCP snooping is not enabled globally ("ip dhcp snooping")'}
      # EOS: without the information option, DHCP snooping is not operational (DISA STIG V-255973)
      - {not: {line: '^ip dhcp snooping information option'}, say: 'DHCP snooping information option (82) is not enabled: snooping is not operational on EOS'}
      - uncovered: &eos_snooping
          what: access VLANs without DHCP snooping
          used: &eos_access_vlans {block: '^interface Ethernet', where_not: '^(switchport mode (trunk|routed)|no switchport|channel-group|shutdown)\b', line: '^switchport access vlan (\d+)', default: 1}
          covered: {line: '^ip dhcp snooping vlan (\S+)'}
          lists: true
    pass_if_any:
      - {uncovered: *eos_snooping, absent: true}
    otherwise: fail
    remediation: |
      ip dhcp snooping
      ip dhcp snooping information option
      ip dhcp snooping vlan <access-vlans>

  LYSS-ACC-021:
    not_applicable_if_any: *eos_no_access
    fail_if_any:
      # a trusted access port skips ARP inspection
      - {block: '^interface Ethernet', where_not: '^(switchport mode (trunk|routed)|no switchport|channel-group|shutdown)\b', line: '^ip arp inspection trust\b'}
      - uncovered: &eos_dai
          what: access VLANs without ARP inspection
          used: *eos_access_vlans
          covered: {line: '^ip arp inspection vlan (\S+)'}
          lists: true
    pass_if_any:
      - {uncovered: *eos_dai, absent: true}
    otherwise: fail
    remediation: |
      ip arp inspection vlan <access-vlans>
      interface <uplink>
         ip arp inspection trust

  LYSS-ACC-022:
    not_applicable_if_any: *eos_no_access
    fail_if_any:
      - {not: {line: '^dot1x system-auth-control'}, say: '802.1X is not enabled globally ("dot1x system-auth-control")'}
      - uncovered: &eos_nac
          what: access ports without 802.1X / MAC authentication
          used: &eos_access_ports {block: '^interface (Ethernet\S+)', where_not: '^(switchport mode (trunk|routed)|no switchport|channel-group|shutdown)\b'}
          covered: {block: '^interface (Ethernet\S+)', where: '^dot1x (port-control auto|mac based authentication)\b'}
    pass_if_any:
      - {uncovered: *eos_nac, absent: true}
    otherwise: fail
    remediation: |
      dot1x system-auth-control
      interface <access-ports>
         dot1x port-control auto
         dot1x mac based authentication

  LYSS-ACC-023:
    not_applicable_if_any: *eos_no_access
    fail_if_any:
      # a 100 % threshold limits nothing
      - {block: '^interface Ethernet', where_not: '^(switchport mode (trunk|routed)|no switchport|channel-group|shutdown)\b', line: '^storm-control broadcast level 100(?:\.0+)?(?:\s|$)'}
      - uncovered: &eos_storm
          what: access ports without broadcast storm control
          used: *eos_access_ports
          covered: {block: '^interface (Ethernet\S+)', where: '^storm-control broadcast level'}
    pass_if_any:
      - {uncovered: *eos_storm, absent: true}
    otherwise: fail
    remediation: |
      interface <access-ports>
         storm-control broadcast level 5

  LYSS-ACC-024:
    # EOS transmits LLDP by default (no CDP); phone ports ("switchport phone") keep LLDP-MED
    not_applicable_if_any: *eos_no_access
    fail_if_any:
      - all:
          - {not: {line: '^no lldp run'}}
          - uncovered: &eos_lldp
              what: access ports sending LLDP
              used: {block: '^interface (Ethernet\S+)', where_not: '^(switchport mode (trunk|routed)|no switchport|channel-group|switchport phone|shutdown)\b'}
              covered: {block: '^interface (Ethernet\S+)', where: '^no lldp transmit'}
    otherwise: pass
    note: Ports with an IP phone configuration ("switchport phone") are exempt; EOS does not send CDP.
    remediation: |
      interface <user-access-ports>
         no lldp transmit
