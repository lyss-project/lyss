# LYSS Specification: vendor-neutral security controls for network switches.
# This file is the normative source: docs/LYSS-Specification.md is generated from it
# (python tools/build_spec.py). It says WHAT must be true; HOW to check it on each platform
# lives in adapters/. Licensed CC BY 4.0 (see LICENSE-SPEC).
spec_version: "0.7.0-draft"
status: draft
levels:
  1: Baseline
  2: Hardened
  3: Advanced

domains:
  MGMT: Management plane access
  AUTH: Authentication and credentials
  LOG: Logging and time
  VULN: Firmware and vulnerabilities
  BKP: Configuration resilience
  ACC: Access-layer protection

controls:

  # ---------------- Level 1: Baseline ----------------

  - id: LYSS-MGMT-001
    level: 1
    title: Telnet management access is disabled
    statement: The switch does not accept management sessions over Telnet.
    rationale: Telnet sends credentials and session data in cleartext; anyone on the path can capture administrator passwords.
    test_procedure: >-
      Check that no management service listens on TCP 23 (device state) and that no remote CLI
      line or service is configured to accept Telnet (configuration). Fail if either shows Telnet
      accepted. Unknown if the platform hides the Telnet default and no device state is available.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.20, A.8.21, A.8.24]
      nist_800_53r5: [CM-7, SC-8, AC-17(2)]
      cis_v8: ["4.8", "12.6"]
      nis2_art21: [h, g]

  - id: LYSS-MGMT-002
    level: 1
    title: SSH management uses protocol version 2 only
    statement: SSH is the remote CLI protocol and SSH protocol version 1 is not accepted.
    rationale: SSHv1 has known cryptographic weaknesses and must not be negotiable.
    test_procedure: >-
      Read the SSH identification string of the switch: "SSH-2.0-" passes, "SSH-1.99-" or
      "SSH-1.5-" fails. Without device state, an explicit "version 2 only" setting passes.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.21, A.8.24]
      nist_800_53r5: [SC-8, SC-13, AC-17(2)]
      cis_v8: ["12.6"]
      nis2_art21: [h]

  - id: LYSS-MGMT-003
    level: 1
    title: Cleartext HTTP management is disabled
    statement: The web management interface, if enabled, is only reachable over HTTPS.
    rationale: Plain HTTP exposes administrator credentials and session cookies.
    test_procedure: >-
      Fail if a management web service listens on TCP 80 (device state) or the plain HTTP server
      is enabled in the configuration, including when it is enabled by default and not disabled.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.21, A.8.24]
      nist_800_53r5: [CM-7, SC-8, AC-17(2)]
      cis_v8: ["4.8", "12.6"]
      nis2_art21: [h]

  - id: LYSS-MGMT-004
    level: 1
    title: Idle management sessions time out within 10 minutes
    statement: Interactive CLI sessions (console and remote) are closed after at most 10 minutes of inactivity.
    rationale: Abandoned privileged sessions can be reused by anyone with access to the terminal or session.
    test_procedure: >-
      Determine the effective idle timeout of every console and remote CLI line: the configured
      value, or the platform's documented default when none is configured. Fail if any effective
      timeout is disabled (0, never) or above the parameter. For example, Cisco IOS and Cisco
      Business default to 10 minutes (pass when unset); HPE AOS-S defaults to no timeout (fail
      when unset).
    evidence: [config]
    parameters: {max_idle_minutes: 10}
    mappings:
      iso27001_2022: [A.8.5]
      nist_800_53r5: [AC-12, SC-10]
      cis_v8: ["4.3"]
      nis2_art21: [i]

  - id: LYSS-AUTH-001
    level: 1
    title: No default or well-known SNMP community strings
    statement: SNMP communities "public", "private" and vendor defaults are not configured.
    rationale: Default communities give anyone on the network read (or write) access to the device.
    test_procedure: Fail if an SNMP community named "public", "private" or a documented vendor default is configured.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.17, A.8.21]
      nist_800_53r5: [IA-5, CM-6]
      cis_v8: ["4.7"]
      nis2_art21: [i, g]

  - id: LYSS-AUTH-002
    level: 1
    title: Privileged-mode password is stored as a strong hash
    statement: >-
      The privileged (enable) credential is stored with a salted one-way hash based on SHA-256 or a
      stronger algorithm (e.g. scrypt, PBKDF2-SHA-256, SHA-256/SHA-512 crypt). Cleartext,
      reversible encodings, MD5- and SHA-1-based hashes and unsalted SHA-256 (Cisco type 4) are
      not accepted.
    rationale: >-
      Reversible encodings (e.g. Cisco type 7) are decoded instantly by public tools from any
      configuration backup, and MD5- or SHA-1-based hashes (e.g. Cisco type 5) are cracked quickly
      on commodity hardware.
    test_procedure: >-
      Fail if the privileged credential, or a local account with full privileges, is stored in
      cleartext, a reversible form, or with MD5, SHA-1 or unsalted SHA-256 (e.g. Cisco "enable
      password", type 4 or 5, a 40-hex-digit SHA-1 value, HPE "sha1"). Pass if it uses an accepted
      salted algorithm (e.g. Cisco type 8 or 9), or if there is no privileged credential and privileged access is only granted
      through central AAA. Unknown if the algorithm cannot be identified.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.17, A.8.5]
      nist_800_53r5: [IA-5(1)]
      cis_v8: ["3.11"]
      nis2_art21: [h, i]

  - id: LYSS-AUTH-003
    level: 1
    title: Local account passwords are not stored in cleartext or reversible form
    statement: Every local user account credential is stored as a one-way hash.
    rationale: Configuration backups circulate (backup servers, tickets, e-mail); stored passwords must not be recoverable.
    test_procedure: Fail if any local account credential is stored in cleartext or a reversible encoding.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.17, A.8.5]
      nist_800_53r5: [IA-5(1)]
      cis_v8: ["3.11"]
      nis2_art21: [h, i]

  - id: LYSS-AUTH-004
    level: 1
    title: AAA shared secrets (RADIUS/TACACS+) are not stored in cleartext
    statement: Keys shared with RADIUS or TACACS+ servers are never stored in cleartext in the configuration.
    rationale: >-
      A cleartext RADIUS key in a backup can be read by anyone who sees the file, and lets an
      attacker impersonate the AAA server or decrypt authentication traffic. Level 1 only removes
      the cleartext key: many switches can only store these keys in a reversible form, which is
      weaker protection and is addressed separately.
    test_procedure: >-
      Fail if a RADIUS or TACACS+ shared key appears in cleartext. A reversible encoding (e.g.
      Cisco type 7) is not cleartext and passes this Level 1 control; it gives only weak protection,
      and storing keys with a device-specific encryption key is planned as a separate Level 2
      control.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.17, A.8.24]
      nist_800_53r5: [IA-5, SC-28]
      cis_v8: ["3.11"]
      nis2_art21: [h]

  - id: LYSS-VULN-001
    level: 1
    title: Firmware is vendor-supported and free of known critical vulnerabilities
    statement: >-
      The vendor still publishes security fixes for the device, and the running firmware has no known
      critical (CVSS >= 9.0) or known-exploited (CISA KEV) vulnerability whose fix is not installed.
    rationale: Unsupported or vulnerable firmware is the most common path to switch compromise.
    test_procedure: >-
      Identify the model and firmware version from device state and compare them with a sourced
      knowledge base (vendor advisories, end-of-life bulletins, CISA KEV). Fail if security support
      has ended, or if an applicable critical (CVSS >= 9.0) or known-exploited (CISA KEV) advisory
      is unfixed in the running version; other advisories do not affect this control. Unknown if
      the platform is not in the knowledge base: a pass is never assumed.
    evidence: [state, external_data]
    mappings:
      iso27001_2022: [A.8.8]
      nist_800_53r5: [SI-2, SA-22, RA-5]
      cis_v8: ["2.2", "12.1"]
      nis2_art21: [e]

  - id: LYSS-BKP-001
    level: 1
    title: Configuration is backed up automatically
    statement: >-
      The running configuration is collected automatically, so that a copy at most 7 days old
      exists at any time.
    rationale: Without a recent backup, recovery after failure or compromise is slow and error-prone.
    test_procedure: >-
      Pass if the most recent automatic (scheduled) collection of the running configuration is at
      most the parameter old at the time of assessment, and the gap between the last two automatic
      collections is not longer than the parameter; a schedule less frequent than the parameter
      therefore fails. Otherwise pass on an external backup system only with evidence
      of its last successful backup for this device, at most the parameter old (for example from the
      backup system's records), or with an administrator attestation, renewed at least every 90
      days, that the external system backs the device up at least as often as the parameter and
      alerts on failure. Fail if the last automatic backup is older, or only manual collections
      exist.
    evidence: [backup_system]
    parameters: {max_age_days: 7}
    mappings:
      iso27001_2022: [A.8.9, A.8.13]
      nist_800_53r5: [CP-9, CM-2(3)]
      cis_v8: ["11.2"]
      nis2_art21: [c]

  # ---------------- Level 2: Hardened ----------------

  - id: LYSS-AUTH-010
    level: 2
    title: Administrative logins use central AAA (RADIUS/TACACS+) with local fallback only
    statement: >-
      Remote administrator logins (SSH, Telnet, web, API) are authenticated by a RADIUS or TACACS+
      server first; local accounts are the only fallback. Logins on the local serial console are out
      of scope: the console is the recovery path when the AAA server cannot be reached.
    rationale: Central AAA gives individual accounts, immediate revocation and an audit trail; shared local passwords do not.
    test_procedure: >-
      Pass if an AAA server is defined and every login method list used for remote administrative
      access starts with the AAA server, with local accounts as the only fallback after it. Fail if
      any such list starts with a local account, a line password or no authentication, or falls
      back to anything other than local accounts (e.g. "none", a line or enable password). Console
      login lists are not assessed.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.16, A.8.5]
      nist_800_53r5: [IA-2, AC-2]
      cis_v8: ["12.5"]
      nis2_art21: [i]

  - id: LYSS-AUTH-011
    level: 2
    title: SNMP uses v3 with authentication and privacy or is disabled
    statement: No SNMPv1/v2c community is configured; SNMP, if used, is SNMPv3 with authentication and encryption.
    rationale: SNMPv1/v2c communities travel in cleartext and are equivalent to shared passwords.
    test_procedure: >-
      Fail if any SNMPv1/v2c community or v1/v2 group is configured, or if any SNMPv3 group or user
      has a security level below authentication with privacy (noAuthNoPriv or authNoPriv).
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.21, A.8.24]
      nist_800_53r5: [SC-8, SC-13, IA-5]
      cis_v8: ["12.6"]
      nis2_art21: [h, i]

  - id: LYSS-MGMT-010
    level: 2
    title: Management access is restricted to authorized source networks
    statement: Management protocols only accept connections from authorized administration networks.
    rationale: Limiting who can even reach the login prompt removes most password-guessing and exploit attempts.
    test_procedure: Pass if every remote management access path is bound to an access list of authorized sources.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.20, A.8.22]
      nist_800_53r5: [AC-17, SC-7]
      cis_v8: ["12.3"]
      nis2_art21: [i]

  - id: LYSS-MGMT-011
    level: 2
    title: Management interface is on a dedicated management VLAN
    statement: >-
      The switch management address is on a VLAN reserved for management: not the default VLAN (1),
      and no user access port is a member of it.
    rationale: Separating management from user networks prevents users from reaching the management plane.
    test_procedure: >-
      Fail if VLAN 1 carries a management address, or if an access (untagged, non-uplink) port is a
      member of the management VLAN. Pass if the management address is on another VLAN with no
      access port.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.22]
      nist_800_53r5: [SC-7, AC-4]
      cis_v8: ["12.2"]
      nis2_art21: [i]

  - id: LYSS-MGMT-012
    level: 2
    title: A legal warning banner is shown before login
    statement: A banner stating authorized use only is displayed before authentication.
    rationale: The warning supports legal action against intruders and informs users that activity is monitored.
    test_procedure: >-
      Pass if a banner displayed before authentication (login or message-of-the-day, not a
      post-login exec banner) is configured and its text states the authorized-use restriction
      ("authorized", "authorised", "unauthorized" or "unauthorised"). Fail otherwise.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.5]
      nist_800_53r5: [AC-8]
      cis_v8: []
      nis2_art21: []

  - id: LYSS-MGMT-013
    level: 2
    title: SSH uses modern key exchange, ciphers and host keys
    statement: The SSH server supports a SHA-2 (or better) key exchange, a CTR/GCM/ChaCha20 cipher and a SHA-2 host key signature.
    rationale: SHA-1 key exchange, CBC ciphers and ssh-rsa (SHA-1) signatures are deprecated; modern clients refuse them and they weaken the management channel.
    test_procedure: >-
      Connect offering the strongest algorithms first and record the negotiated ones (the best the
      switch supports). Fail on a SHA-1 or group1 key exchange, a CBC/3DES/RC4 cipher, or an
      ssh-rsa/ssh-dss host key signature.
    evidence: [state]
    mappings:
      iso27001_2022: [A.8.24, A.8.21]
      nist_800_53r5: [SC-8, SC-13]
      cis_v8: ["3.10", "12.6"]
      nis2_art21: [h]

  - id: LYSS-LOG-010
    level: 2
    title: Events are sent to a remote syslog/SIEM server
    statement: The switch forwards its logs to at least one remote syslog or SIEM collector.
    rationale: Local logs are lost on reboot and can be erased by an intruder; remote logs support detection and investigation.
    test_procedure: >-
      Fail if logging is disabled globally (e.g. "no logging on"), or if forwarding to remote
      servers is turned off (e.g. Cisco IOS "no logging trap"). Pass if at least one remote syslog
      destination is configured and logging to it is enabled.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.15, A.8.16]
      nist_800_53r5: [AU-4(1), AU-6]
      cis_v8: ["8.2", "8.9"]
      nis2_art21: [b]

  - id: LYSS-LOG-011
    level: 2
    title: Clock is synchronized with NTP/SNTP
    statement: The switch clock is synchronized with at least one configured time server.
    rationale: Without a reliable clock, logs cannot be correlated and certificates and schedules misbehave.
    test_procedure: >-
      Fail if no NTP or SNTP server is configured, or if the device state reports the clock as not
      synchronized. Pass if a time server is configured and the device state does not report the
      clock as unsynchronized. Unknown without device state: a configured server alone does not
      show that the clock is synchronized.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.17]
      nist_800_53r5: [AU-8, SC-45]
      cis_v8: ["8.4"]
      nis2_art21: [b]

  - id: LYSS-ACC-010
    level: 2
    title: Unused ports are administratively disabled
    statement: Ports with no link are administratively shut down.
    rationale: An enabled, unused port lets anyone plug in an unauthorized device.
    test_procedure: Fail if any port is operationally down while administratively enabled (device state).
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.20]
      nist_800_53r5: [CM-7]
      cis_v8: ["12.3"]
      nis2_art21: [g, i]

  - id: LYSS-ACC-011
    level: 2
    title: Edge ports are protected against rogue spanning-tree participants (BPDU guard)
    statement: >-
      Every edge port disables itself when it receives a spanning-tree BPDU. Links to other
      switches are configured as such (trunks or link aggregations); every other port is an edge port.
    rationale: A rogue or misconnected switch on an access port can take over the spanning tree or create a loop.
    test_procedure: >-
      Edge ports are all ports minus uplinks, and uplinks are only the ports configured as trunks
      or link-aggregation members (tagged on HPE AOS-S). A link aggregation that is not a trunk
      (for example towards a server) is itself an edge port: it is checked on its logical interface,
      while its member ports are not checked one by one. Neighbour discovery never exempts a port:
      a rogue device can advertise bridge capability. Fail if an edge port lacks BPDU protection,
      unless a global default protects all edge ports.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.20]
      nist_800_53r5: [SC-5, CM-6]
      cis_v8: ["12.2"]
      nis2_art21: [g]

  # ---------------- Level 3: Advanced ----------------
  # Access-layer protections against attacks from user ports. "Access ports" are the ports that are
  # neither links to other switches (trunks, link aggregations, tagged/uplink ports) nor routed
  # ports, as defined for LYSS-ACC-011; "user VLANs" are the VLANs those access ports belong to.
  # Each control is not applicable on a switch without access ports (core, aggregation, spine).

  - id: LYSS-ACC-020
    level: 3
    title: DHCP snooping is enabled on user VLANs
    statement: >-
      DHCP snooping is enabled globally and on every VLAN used by an access port, so that DHCP
      server messages are only accepted from trusted (uplink) ports.
    rationale: >-
      A rogue DHCP server on a user port can hand out its own gateway and DNS server and intercept
      traffic; DHCP snooping drops server messages from untrusted ports and builds the binding table
      that ARP inspection and IP source guard rely on.
    test_procedure: >-
      Fail if DHCP snooping is not enabled globally, if a VLAN used by an access port is not in
      the snooping VLAN list, or if an access port is trusted for DHCP (it would accept server
      messages). Pass if it is enabled, every such VLAN is covered (on platforms where snooping
      applies to the whole bridge, the bridge setting covers every access port) and no access port
      is trusted. Not applicable without access ports.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.20, A.8.22]
      nist_800_53r5: [SC-7, SI-4]
      nis2_art21: [g]

  - id: LYSS-ACC-021
    level: 3
    title: Dynamic ARP inspection is enabled on user VLANs
    statement: >-
      ARP packets received on access ports are checked against the DHCP snooping bindings (or static
      ARP access lists) on every VLAN used by an access port.
    rationale: >-
      Without ARP inspection, any user device can claim the gateway's IP address (ARP spoofing) and
      read or alter the traffic of every host in the VLAN.
    test_procedure: >-
      Fail if a VLAN used by an access port is not covered by dynamic ARP inspection, if an access
      port is trusted for ARP inspection (its ARP packets would not be checked), or if the platform
      offers no ARP inspection (the report names the platform limit). Pass if every such VLAN is
      covered and no access port is trusted. Not applicable without access ports.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.20, A.8.22]
      nist_800_53r5: [SC-7, SI-4]
      nis2_art21: [g]

  - id: LYSS-ACC-022
    level: 3
    title: Access ports require 802.1X or MAC authentication
    statement: >-
      Every access port authenticates the connected device (IEEE 802.1X, or MAC authentication
      bypass for devices without a supplicant) before granting network access.
    rationale: >-
      Without port authentication, anyone who can plug a cable into a wall socket is on the internal
      network.
    test_procedure: >-
      Fail if port authentication is not enabled globally where the platform requires it, if an
      access port has no 802.1X / MAC authentication setting, or if an access port forwards traffic
      before authentication succeeds (open mode, e.g. Cisco "authentication open"). Pass if every
      access port enforces one. Not applicable without access ports.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.20, A.5.15]
      nist_800_53r5: [IA-3, AC-3]
      cis_v8: ["13.9"]
      nis2_art21: [i]

  - id: LYSS-ACC-023
    level: 3
    title: Storm control limits broadcast traffic on access ports
    statement: Every access port limits the rate of broadcast traffic it accepts (storm control).
    rationale: >-
      A loop or a misbehaving device on one user port can flood broadcast traffic to every port of
      the VLAN and take the network down; a rate limit contains it on the offending port.
    test_procedure: >-
      Fail if an access port has no broadcast rate limit, or a limit of 100 % (which limits
      nothing). Pass if every access port has an effective one.
      Unknown when the platform sets it on the switch chip and the setting cannot be read. Not
      applicable without access ports.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.20, A.8.6]
      nist_800_53r5: [SC-5]
      nis2_art21: [g]

  - id: LYSS-ACC-024
    level: 3
    title: Neighbor discovery (CDP/LLDP) is not sent on untrusted access ports
    statement: >-
      Access ports do not transmit CDP or LLDP advertisements, except ports that serve IP phones
      (a voice VLAN), which need LLDP-MED or CDP.
    rationale: >-
      CDP and LLDP advertisements tell anyone on a user port the switch name, model, software
      version, management address and VLANs, which helps an attacker choose an exploit.
    test_procedure: >-
      Pass if neighbor discovery transmission is disabled globally, or on every access port without
      a voice VLAN, for each protocol the platform sends by default or that is enabled. Fail
      otherwise. Not applicable without access ports.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.20]
      nist_800_53r5: [CM-7]
      cis_v8: ["4.8"]
      nis2_art21: [g]
