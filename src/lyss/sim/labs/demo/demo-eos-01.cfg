! Command: show running-config
! device: demo-eos-01 (CCS-720XP-24ZY4, EOS-4.32.2F)
!
! boot system flash:/EOS-4.32.2F.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$DEMOSALT$DemoHashDemoHashDemoHashDemoHash
username lyss-demo privilege 15 role network-operator secret sha512 $6$DEMOSALT$DemoHashLyssDemoHashLyssDemoHash
!
management console
   idle-timeout 10
!
management ssh
   ip access-group MGMT in
   idle-timeout 10
!
hostname demo-eos-01
!
snmp-server group LYSS v3 priv
snmp-server user lyss-ro LYSS v3 auth sha256 DemoAuthKey1 priv aes DemoPrivKey1
!
spanning-tree mode mstp
spanning-tree edge-port bpduguard default
!
tacacs-server host 192.0.2.50 key 7 DemoTacacsKey7
!
aaa group server tacacs+ TACACS
   server 192.0.2.50
!
aaa authentication login default group TACACS local
aaa authorization exec default group TACACS local
aaa authorization commands all default group TACACS local
!
banner login
Authorized access only. Activity is logged.
EOF
!
ip dhcp snooping
ip dhcp snooping information option
ip dhcp snooping vlan 10
ip arp inspection vlan 10
dot1x system-auth-control
!
vlan 10
   name USERS
!
vlan 99
   name MGMT
!
interface Ethernet1
   switchport access vlan 10
   dot1x port-control auto
   storm-control broadcast level 5
   no lldp transmit
!
interface Ethernet2
   switchport access vlan 10
   dot1x port-control auto
   storm-control broadcast level 5
   no lldp transmit
!
interface Ethernet3
   switchport access vlan 10
   dot1x port-control auto
   storm-control broadcast level 5
   no lldp transmit
!
interface Ethernet4
   switchport access vlan 10
   dot1x port-control auto
   storm-control broadcast level 5
   no lldp transmit
!
interface Ethernet5
   shutdown
!
interface Ethernet6
   shutdown
!
interface Ethernet25
   description Uplink DEMO-CORE
   switchport mode trunk
   ip arp inspection trust
!
interface Vlan99
   ip address 192.0.2.45/24
!
ip access-list MGMT
   10 permit tcp 192.0.2.0/24 any eq ssh
!
logging host 192.0.2.60
!
ntp server 192.0.2.123
!
end
