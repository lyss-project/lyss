!
version 15.2
service timestamps log datetime msec
service password-encryption
!
hostname DEMO-CORE
!
aaa new-model
aaa group server radius DEMO-NPS
 server name NPS-1
aaa authentication login default group DEMO-NPS local
aaa authorization exec default group DEMO-NPS local
enable algorithm-type scrypt secret 9 $9$DemoSaltDemoSa$DemoHashDemoHashDemoHashDemoHashDemoHashDe
username netadmin privilege 15 secret 9 $9$DemoSaltDemoSa$DemoHashDemoHashDemoHashDemoHashDemoHashDe
ip ssh version 2
no ip http server
ip http secure-server
logging trap informational
logging host 192.0.2.60
ntp server 192.0.2.123
snmp-server group LYSS v3 priv
spanning-tree mode rapid-pvst
spanning-tree portfast edge bpduguard default
lldp run
banner login ^CAuthorized access only. Activity is logged.^C
!
radius server NPS-1
 address ipv4 192.0.2.50 auth-port 1812 acct-port 1813
 key 6 DemoAesKeyDemoAesKeyDemoAesKey
!
interface Vlan1
