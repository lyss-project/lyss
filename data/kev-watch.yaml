  - {cve: CVE-2018-0155, reason: "Catalyst 4500 / 4500-X (BFD offload) only", checked: 2026-11-08}
  - {cve: CVE-2018-0174, reason: "listed by CISA for IOS XE; published 2018, before the Catalyst 1000 software", checked: 2026-11-08}
  - {cve: CVE-2023-20198, reason: "IOS XE web UI only; the Catalyst 1000 runs IOS", checked: 2026-11-08}
  - {cve: CVE-2023-20273, reason: "IOS XE web UI only; the Catalyst 1000 runs IOS", checked: 2026-11-08}
  - {cve: CVE-2025-20393, reason: "Cisco Secure Email / Web Manager appliances (AsyncOS), not IOS", checked: 2026-11-08}
