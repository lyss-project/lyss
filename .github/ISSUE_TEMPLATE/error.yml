name: Error or crash
description: Something failed (installation, collection, interface, report).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove your addresses, device names and any secret from logs before posting.
        **Security vulnerabilities must be reported privately**: see SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, from the start, and what you expected.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: The text in the console window (the error and the lines above it).
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, LYSS 0.17.0
    validations:
      required: true
