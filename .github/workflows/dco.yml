name: dco

# Every commit of a pull request must carry a Signed-off-by line (Developer Certificate of Origin,
# see CONTRIBUTING.md). Runs on pull_request (not pull_request_target): no secrets, read-only.
on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $c has no 'Signed-off-by: $author' line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
