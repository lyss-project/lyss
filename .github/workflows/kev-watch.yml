name: kev-watch

# Weekly check of the CISA Known Exploited Vulnerabilities catalog for the platforms LYSS knows
# (tools/kev_watch.py). The run fails when a new entry is not yet in data/firmware.yaml, so the
# maintainer is notified; the report is in the job summary. Read-only: no token, no secret.
on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r .github/action-requirements.txt
      - name: Check the KEV catalog
        run: python tools/kev_watch.py --summary "$GITHUB_STEP_SUMMARY"
