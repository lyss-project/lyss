name: release

# Publishing a GitHub release (tag vX.Y.Z) builds LYSS and uploads it to PyPI with Trusted
# Publishing: PyPI trusts this workflow through OpenID Connect, no password or API token is stored.
# PyPI also records signed provenance for each file (this repository, this workflow), and a
# CycloneDX SBOM is attached to the GitHub release. Third-party actions are pinned to commit SHAs.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Version matches the release tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "pyproject version v$version != tag $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt   # also the isolated build
        run: |
          python -m pip install -c .github/build-constraints.txt build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke test of the wheel, outside the repository
        run: |
          python -m venv /tmp/lyss-venv
          /tmp/lyss-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/lyss-venv/bin/lyss audit --vendor mikrotik --level 2 "$GITHUB_WORKSPACE/tests/cases/mikrotik-weak/config.cfg"
          # the installed package carries the whole demo lab and every adapter of the repository
          /tmp/lyss-venv/bin/python - "$GITHUB_WORKSPACE" <<'EOF'
          import sys
          from pathlib import Path
          import yaml
          from lyss import engine
          from lyss.sim import load_lab
          repo = Path(sys.argv[1])
          assert engine.INSTALLED
          expected = yaml.safe_load((repo / "src/lyss/sim/labs/demo/lab.yaml").read_text(encoding="utf-8"))["switches"]
          assert set(load_lab("demo").switches) == set(expected), "demo lab incomplete in the wheel"
          assert {p.stem for p in engine.ADAPTER_DIR.glob("*.yaml")} == {p.stem for p in (repo / "adapters").glob("*.yaml")}
          print("demo switches:", len(expected), "| adapters:", len(list(engine.ADAPTER_DIR.glob("*.yaml"))))
          EOF
      - name: SBOM (CycloneDX) of the wheel as installed, with every dependency version
        run: |
          python -m venv /tmp/sbom-tool
          /tmp/sbom-tool/bin/pip install --disable-pip-version-check "cyclonedx-bom==8.0.1"
          mkdir -p sbom
          /tmp/sbom-tool/bin/cyclonedx-py environment --of JSON -o "sbom/lyss-${GITHUB_REF_NAME#v}.cdx.json" /tmp/lyss-venv/bin/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom/

  sbom:
    # attaches the SBOM to the GitHub release; the only job allowed to write to the repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sbom
          path: sbom/
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" sbom/*.cdx.json --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lyss/
    permissions:
      id-token: write   # Trusted Publishing (OIDC), nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3