set snmp v3 vacm access group LYSS default-context-prefix security-model usm security-level privacy read-view all
set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members USERS
set interfaces ge-0/0/1 disable
set interfaces ge-0/0/0 unit 0 family ethernet-switching storm-control USER-SC
set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members VOICE-USERS
set interfaces ge-0/0/2 unit 0 family ethernet-switching storm-control USER-SC
