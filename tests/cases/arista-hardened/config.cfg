! Command: show running-config
! device: lab-eos-hard (DCS-7050SX3-48YC8, EOS-4.34.2F)
!
! boot system flash:/EOS-4.34.2F.swi
!
! Synthetic LYSS fixture (fake data)
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$FAKEHASH$abcdefghijklmnopqrstuvwxyz
!
management api http-commands
   no shutdown
!
system control-plane
   ip access-group MGMT in
!
management console
   idle-timeout 10
!
management ssh
   ip access-group MGMT in
   idle-timeout 10
   cipher aes256-gcm@openssh.com aes256-ctr
   key-exchange curve25519-sha256 ecdh-sha2-nistp256
   mac hmac-sha2-512 hmac-sha2-256
!
hostname lab-eos-hard
!
snmp-server ipv4 access-list MGMT
snmp-server group LYSS v3 priv
snmp-server user lyss-ro LYSS v3 auth sha256 FAKEAUTHPW priv aes FAKEPRIVPW
