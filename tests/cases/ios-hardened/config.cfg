!
hostname lab-ios-hard
!
service password-encryption
aaa new-model
aaa group server radius NPS-GRP
 server name NPS
aaa authentication login default group NPS-GRP local
aaa authorization exec default group NPS-GRP local
enable algorithm-type scrypt secret 9 $9$FAKEFAKEFAKEFA$FAKEHASHFAKEHASHFAKEHASHFAKEHASHFAKEHASHFA
username admin privilege 15 secret 9 $9$FAKEFAKEFAKEFA$FAKEHASHFAKEHASHFAKEHASHFAKEHASHFAKEHASHFA
ip ssh version 2
no ip http server
ip http secure-server
ip http access-class ipv4 MGMT
logging host 192.0.2.60
ntp server 192.0.2.123
snmp-server group LYSS v3 priv access MGMT
spanning-tree portfast edge bpduguard default
banner login ^CAuthorized access only. Activity is logged.^C
!
radius server NPS
 address ipv4 192.0.2.50 auth-port 1812 acct-port 1813
 key 6 FAKEAESKEYFAKEAESKEY
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 ip address 192.0.2.11 255.255.255.0
!
interface GigabitEthernet1/0/1
 switchport mode access
!
interface GigabitEthernet1/0/2
 shutdown
!
ip access-list standard MGMT
 permit 192.0.2.0 0.0.0.255
!
line con 0
 exec-timeout 10 0
line vty 0 4
 access-class MGMT in
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 access-class MGMT in
 exec-timeout 10 0
 transport input ssh
!
end
